<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Prompt lab layout — E, one document</title>
<style>
  /* -----------------------------------------------------------------
     Variant E — "one document". A fork of D that deletes the tabs.

     Two complaints killed the tab row. First, Context and State are not
     places you go — they are parts of the same assembled turn, and a tab
     is a claim that you are somewhere else. Second, the agent runs across
     all three parts, so docking AGENT to the System tab was a lie.

     So: one scroll, top to bottom. System, a quiet divider, Context, a
     quiet divider, State. The dock keeps every zone mounted at once,
     and the TURN map — a grouped outline carrying the token counts the
     status line used to carry — does the work the tabs were doing.
     Read-only parts are dimmed, not hidden. The gutter "+" appears only
     where a request can actually land: on the prompt itself.
     ----------------------------------------------------------------- */
  :root {
    --bg: #161719;
    --surface: #1c1e21;
    --line: #26282c;
    --line-soft: #202226;
    --fg: #c9ccd1;
    --bright: #dde0e5;
    --muted: #6b7078;
    --faint: #4c5158;
    --tag: #8f7bb5;
    --tag-dim: #6f6189;
    --var: #d0a45c;
    --accent: #8fa2bd;
    --open: #b8894a;
    --done: #4c5158;
    --mono: ui-monospace, "SF Mono", SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", monospace;

    --col: 96ch;       /* the document column */
    --dock: 280px;     /* furniture in the margin */
    --dock-gap: 20px;
    --dock-top: 24px;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--fg);
    font-family: var(--mono);
    font-size: 13px;
    line-height: 1.8;
    display: flex;
    flex-direction: column;
    overflow: hidden;
    -webkit-font-smoothing: antialiased;
  }
  button, input {
    font-family: inherit;
    font-size: 12px;
    background: transparent;
    color: inherit;
    border: 0;
    padding: 0;
    line-height: inherit;
  }
  button { cursor: pointer; }

  /* ---------- document surface: no top chrome at all ---------- */
  #main { flex: 1; min-height: 0; display: flex; }
  #stage {
    flex: 1;
    min-width: 0;
    overflow-y: auto;
    overflow-x: hidden;
  }
  #doc {
    max-width: var(--col);
    margin: 0 auto;
    padding: 34px 0 46vh;
  }

  /* ---------- the three parts of one turn ---------- */
  .part { }
  .part.ro { opacity: 0.8; }

  /* the quiet seam between parts */
  .divider {
    margin: 46px 0 32px;
    border-top: 1px solid var(--line);
    padding: 9px 0 0 2ch;
    color: var(--faint);
    font-size: 10px;
    letter-spacing: 0.17em;
    text-transform: uppercase;
    user-select: none;
  }

  .sec { margin-bottom: 30px; }
  .part > .sec:last-child { margin-bottom: 0; }
  .tagline { color: var(--tag); white-space: pre; padding-left: 2ch; }

  .row { display: flex; align-items: baseline; }
  .row .body {
    flex: 1;
    min-width: 0;
    display: flex;
    align-items: baseline;
    gap: 1ch;
    padding: 1px 10px 1px 6px;
  }
  .row.sub .body { padding-left: calc(3ch + 6px); }
  .row.para .body { margin-top: 8px; margin-bottom: 8px; }
  .row .mk { color: var(--muted); flex: 0 0 auto; }
  .row .kk { color: var(--muted); flex: 0 0 21ch; }
  .row .tx { color: var(--fg); min-width: 0; }
  .row.spacer { height: 10px; }

  .part.live .row .body { cursor: pointer; }
  .part.live .row:hover .body { background: rgba(255, 255, 255, 0.028); }
  .row.sel .body {
    background: rgba(255, 255, 255, 0.05);
    box-shadow: inset 2px 0 0 var(--accent);
  }
  .row.flash .body {
    background: rgba(184, 137, 74, 0.13);
    box-shadow: inset 2px 0 0 var(--open);
  }

  /* the gutter: only on the prompt — context and state are code, not copy */
  .gut {
    flex: 0 0 2ch;
    align-self: flex-start;
    color: var(--faint);
    text-align: left;
    opacity: 0;
    transition: opacity 90ms ease;
  }
  .row.para .gut { margin-top: 8px; }
  .row:hover button.gut { opacity: 1; }
  button.gut:hover { color: var(--fg); }
  .gut.pinned { opacity: 1; color: var(--open); font-size: 9px; }

  .rchip {
    flex: 0 0 auto;
    color: var(--open);
    font-size: 11px;
    letter-spacing: 0.05em;
  }

  .itag { color: var(--tag-dim); }
  .var { color: var(--var); }
  .tool { color: #949aa4; }

  /* ---------- inline composer ---------- */
  .composer { padding: 6px 0 8px calc(2ch + 6px); }
  .cin {
    display: block;
    width: min(62ch, 100%);
    color: var(--bright);
    border-bottom: 1px solid var(--line);
    padding: 2px 0 4px;
    outline: none;
    font-size: 13px;
  }
  .cin::placeholder { color: var(--faint); }
  .cin:focus { border-bottom-color: #3d4148; }
  .chint {
    color: var(--faint);
    font-size: 10px;
    letter-spacing: 0.06em;
    margin-top: 4px;
  }

  /* ---------- the dock: furniture in the right margin ---------- */
  #dock {
    position: fixed;
    right: var(--dock-gap);
    top: var(--dock-top);
    width: var(--dock);
    bottom: 0;
    overflow-y: auto;
    overflow-x: hidden;
    padding-bottom: 46px;
  }
  .zone { border-bottom: 1px solid var(--line-soft); }
  .zone:last-child { border-bottom: 0; }
  .zone.gone { display: none; }
  .zhead {
    display: flex;
    align-items: center;
    gap: 8px;
    width: 100%;
    padding: 10px 0 7px;
    color: var(--faint);
    font-size: 10px;
    letter-spacing: 0.17em;
    text-transform: uppercase;
    cursor: default;
  }
  .zhead.tog { cursor: pointer; }
  .zhead.tog:hover { color: var(--muted); }
  .zsp { flex: 1; }
  .zhead .zn { letter-spacing: 0.06em; }
  .zhead .zc { font-size: 9px; transition: transform 120ms ease; }
  .zone.closed .zc { transform: rotate(-90deg); }
  .zbody { padding-bottom: 12px; }
  .zone.closed .zbody { display: none; }

  /* agent — always on, because the agent runs the whole turn */
  .aname { color: var(--fg); }
  .amodel { color: var(--muted); font-size: 11px; }
  .adesc { color: var(--faint); font-size: 11px; line-height: 1.6; margin-top: 4px; }

  /* turn map — the grouped outline that replaced the tabs */
  .ogroup { margin-bottom: 9px; }
  .ogroup:last-child { margin-bottom: 0; }
  .ghead {
    display: flex;
    align-items: baseline;
    gap: 8px;
    width: 100%;
    text-align: left;
    color: var(--muted);
    padding: 3px 0 2px;
  }
  .ghead:hover { color: var(--fg); }
  .ghead.active { color: var(--bright); }
  .ghead .gc { color: var(--faint); font-size: 10px; letter-spacing: 0.04em; }
  .ghead.active .gc { color: var(--muted); }

  .oitem {
    display: block;
    width: 100%;
    text-align: left;
    color: var(--faint);
    font-size: 11px;
    padding: 1px 0 1px 10px;
    margin-left: 1px;
    border-left: 1px solid transparent;
  }
  .oitem:hover { color: var(--fg); }
  .ogroup.active .oitem { color: var(--muted); }
  .oitem.active { color: var(--fg); border-left-color: var(--accent); }

  /* fixture — a one-liner until you are standing in the state part */
  .fline {
    display: block;
    width: 100%;
    text-align: left;
    color: var(--muted);
    font-size: 11px;
    padding: 1px 0 1px 10px;
  }
  .fline:hover { color: var(--fg); }
  .fline .fk { color: var(--faint); }
  .zone.expanded .fline { display: none; }
  .flist { display: none; }
  .zone.expanded .flist { display: block; }
  .fitem {
    display: flex;
    align-items: baseline;
    gap: 8px;
    width: 100%;
    text-align: left;
    color: var(--muted);
    padding: 2px 0 2px 10px;
    border-left: 1px solid transparent;
  }
  .fitem:hover { color: var(--fg); }
  .fitem.active { color: var(--fg); border-left-color: var(--accent); }
  .fitem .fn { color: var(--faint); font-size: 10px; }

  /* details */
  .drow { display: flex; gap: 8px; font-size: 11px; line-height: 1.7; }
  .drow .dk { color: var(--faint); flex: 0 0 42px; }
  .drow .dv { color: var(--muted); min-width: 0; overflow-wrap: break-word; }
  .drow .dv.id { color: var(--fg); word-break: break-all; }

  /* requests */
  .rrow {
    display: flex;
    align-items: baseline;
    gap: 8px;
    width: 100%;
    text-align: left;
    padding: 3px 0;
    color: var(--muted);
  }
  .rrow:hover { color: var(--fg); }
  .rdot {
    flex: 0 0 6px;
    width: 6px; height: 6px;
    border-radius: 50%;
    background: var(--done);
    align-self: center;
  }
  .rdot.open { background: var(--open); }
  .rrow .ra { flex: 0 0 auto; color: var(--fg); font-size: 11px; }
  .rrow .rt {
    flex: 1;
    min-width: 0;
    font-size: 11px;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }

  /* history */
  .hrow { display: flex; align-items: baseline; gap: 8px; font-size: 11px; color: var(--muted); padding: 2px 0; }
  .hrow.past .hh { color: var(--muted); }
  .hrow .hh { color: var(--fg); }
  .hrow .hsp { flex: 1; }
  .hrow .ht { color: var(--faint); }
  .hrow .hcur { color: var(--faint); font-size: 9px; letter-spacing: 0.1em; }

  /* ---------- corners ---------- */
  #status {
    position: fixed;
    right: var(--dock-gap);
    bottom: 9px;
    color: var(--faint);
    font-size: 10px;
    letter-spacing: 0.06em;
    pointer-events: none;
    user-select: none;
  }
  #stamp {
    position: fixed;
    left: 14px;
    bottom: 9px;
    color: var(--faint);
    font-size: 10px;
    letter-spacing: 0.12em;
    pointer-events: none;
    user-select: none;
  }

  /* ---------- fallback: too narrow to keep the dock in a margin ---------- */
  @media (max-width: 1399px) {
    #dock {
      position: static;
      flex: 0 0 260px;
      width: 260px;
      border-left: 1px solid var(--line);
      background: var(--surface);
      padding: 0 14px 40px;
      overflow-y: auto;
    }
    #doc {
      margin: 0;
      padding-left: max(2ch, 20px);
      padding-right: 24px;
    }
    #status { right: 14px; }
  }

  ::-webkit-scrollbar { width: 9px; height: 9px; }
  ::-webkit-scrollbar-thumb { background: #24262a; }
  ::-webkit-scrollbar-track { background: transparent; }
</style>
</head>
<body>

<div id="main">
  <main id="stage">
    <div id="doc">
      <div id="sections"></div>
    </div>
  </main>

  <aside id="dock">
    <div class="zone" id="zAgent">
      <div class="zhead"><span>Agent</span></div>
      <div class="zbody">
        <div class="aname">prompt-editor</div>
        <div class="amodel">claude-fable-5</div>
        <div class="adesc">Edits an agent&rsquo;s system prompt on behalf of the human who owns it.</div>
      </div>
    </div>

    <div class="zone" id="zTurn">
      <div class="zhead"><span>Turn</span></div>
      <div class="zbody" id="turnBody"></div>
    </div>

    <div class="zone" id="zFixture">
      <div class="zhead"><span>Fixture</span></div>
      <div class="zbody" id="fixtureBody"></div>
    </div>

    <div class="zone gone" id="zDetails">
      <div class="zhead"><span>Details</span></div>
      <div class="zbody" id="detailsBody"></div>
    </div>

    <div class="zone gone" id="zRequests">
      <div class="zhead"><span>Requests</span><span class="zsp"></span><span class="zn" id="reqCount"></span></div>
      <div class="zbody" id="requestsBody"></div>
    </div>

    <div class="zone closed" id="zHistory">
      <button class="zhead tog" id="histHead">
        <span>History</span><span class="zsp"></span><span class="zc">&#9662;</span>
      </button>
      <div class="zbody" id="historyBody"></div>
    </div>
  </aside>
</div>

<div id="status">saved 3:42 PM</div>
<div id="stamp">E &mdash; one document</div>

<script>
"use strict";

/* =====================================================================
   Documents. Node ids are the real ones from the prompt-editor
   prompt.json, so DETAILS reports something true.
   ===================================================================== */

const SYSTEM = [
  { tag: "purpose", rows: [
    { id: "node-purpose-identity", kind: "paragraph", type: "para",
      diag: "1 variable · {{targetAgent}} declared",
      text: "You are the prompt editor for {{targetAgent}} — you change that agent's system prompt on behalf of the human who owns it." },
    { spacer: true },
    { id: "node-purpose-frame-ast", kind: "listItem", type: "bullet",
      diag: "in bulletList node-purpose-frame · 1 of 3",
      text: "The prompt is a structured document — a tree of identified nodes — and its rendered markdown is a projection you never touch." },
    { id: "node-purpose-frame-requests", kind: "listItem", type: "bullet",
      diag: "in bulletList node-purpose-frame · 2 of 3",
      text: "Work arrives as requests: human notes pinned to a node or range of that document, queued in the <requests> block." },
    { id: "node-purpose-frame-staged", kind: "listItem", type: "bullet",
      diag: "in bulletList node-purpose-frame · 3 of 3",
      text: "Your edits are staged proposals for human review, and nothing lands in the live prompt until the human accepts it." },
  ]},
  { tag: "inputs", rows: [
    { id: "node-inputs-intro", kind: "paragraph", type: "para",
      diag: "leads bulletList node-inputs-blocks",
      text: "Your standing context carries three blocks:" },
    { spacer: true },
    { id: "node-inputs-authoring", kind: "listItem", type: "bullet",
      diag: "in bulletList node-inputs-blocks · 1 of 3",
      text: "<prompt_kit_authoring> — the house reference for how prompts here are built: the document model, the editing method, and the anti-patterns to avoid." },
    { id: "node-inputs-target", kind: "listItem", type: "bullet",
      diag: "in bulletList node-inputs-blocks · 2 of 3 · 1 child",
      text: "<target_prompt> — the target agent's current prompt rendered with every node's id stamped in place, under the base hash your transactions build on." },
    { id: "node-inputs-target-ids", kind: "listItem", type: "sub",
      diag: "nested under node-inputs-target",
      text: "Those ids are the only addresses your edits use — quote them exactly." },
    { id: "node-inputs-requests", kind: "listItem", type: "bullet",
      diag: "in bulletList node-inputs-blocks · 3 of 3 · 2 children",
      text: "<requests> — the open queue, one entry per request." },
    { id: "node-inputs-requests-entry", kind: "listItem", type: "sub",
      diag: "nested under node-inputs-requests",
      text: "Each entry carries its alias (R1, R2 …), its target node or range, the human's note, and the thread so far." },
    { id: "node-inputs-requests-doclevel", kind: "listItem", type: "sub",
      diag: "nested under node-inputs-requests",
      text: "An entry whose target is the document itself is a message about the whole prompt, not about one node." },
    { spacer: true },
    { id: "node-inputs-fresh", kind: "paragraph", type: "para",
      diag: "closes <inputs> · references tool read_prompt",
      text: "The stamped render is your starting picture; read_prompt returns the live document — ids and hash included — whenever you need to confirm the tree or see it after a proposal." },
  ]},
  { tag: "editing_rules", rows: [
    { id: "node-rules-structural", kind: "listItem", type: "bullet",
      diag: "in bulletList node-rules · 1 of 6",
      text: "Propose structure, never prose: an edit is a transaction of id-relative steps against the document tree, and rewritten markdown is never an edit." },
    { id: "node-rules-ids", kind: "listItem", type: "bullet",
      diag: "in bulletList node-rules · 2 of 6",
      text: "Preserve node ids: change nodes in place and leave untouched nodes untouched, because ids are how requests, diffs, and undo stay anchored." },
    { id: "node-rules-minimal", kind: "listItem", type: "bullet",
      diag: "in bulletList node-rules · 3 of 6",
      text: "Prefer the minimal transaction: the fewest steps that satisfy the request, touching nothing the request did not name." },
    { id: "node-rules-valid", kind: "listItem", type: "bullet",
      diag: "in bulletList node-rules · 4 of 6",
      text: "Keep the document valid: every variable placeholder it references must stay declared, and a proposal that fails validation bounces straight back to you — repair it and propose again." },
    { id: "node-rules-voice", kind: "listItem", type: "bullet",
      diag: "in bulletList node-rules · 5 of 6 · 1 open request",
      text: "Respect the target prompt's voice: match its tense, person, and section idiom, and change style only when a note asks for style." },
    { id: "node-rules-terse", kind: "listItem", type: "bullet",
      diag: "in bulletList node-rules · 6 of 6",
      text: "Write tersely: notes, replies, and resolutions are plain language, a sentence or two, never a restatement of a diff the human can already see." },
  ]},
  { tag: "workflow", rows: [
    { id: "node-workflow-read", kind: "listItem", type: "step", n: 1,
      diag: "in orderedList node-workflow-steps · 1 of 6 · 1 child",
      text: "Read the whole queue before editing anything, because requests can overlap, conflict, or share nodes." },
    { id: "node-workflow-read-collide", kind: "listItem", type: "sub",
      diag: "nested under node-workflow-read",
      text: "When requests collide, work them in alias order and name the interaction in each resolution." },
    { id: "node-workflow-plan", kind: "listItem", type: "step", n: 2,
      diag: "in orderedList node-workflow-steps · 2 of 6",
      text: "Plan each request against the current tree, confirming targets with read_prompt when the stamped render leaves doubt." },
    { id: "node-workflow-propose", kind: "listItem", type: "step", n: 3,
      diag: "in orderedList node-workflow-steps · 3 of 6 · 1 child",
      text: "Propose exactly one transaction per request with propose_transaction, tagged to that request's alias." },
    { id: "node-workflow-propose-nochange", kind: "listItem", type: "sub",
      diag: "nested under node-workflow-propose",
      text: "A request needing no change gets no transaction — it gets a resolution." },
    { id: "node-workflow-resolve", kind: "listItem", type: "step", n: 4,
      diag: "in orderedList node-workflow-steps · 4 of 6 · 1 child",
      text: "Resolve every request individually with resolve_request: done with a short note of what changed, or declined with the reason." },
    { id: "node-workflow-resolve-nolump", kind: "listItem", type: "sub",
      diag: "nested under node-workflow-resolve",
      text: "A batch never resolves as a lump, and the session ends with no request still open that you could have disposed." },
    { id: "node-workflow-ask", kind: "listItem", type: "step", n: 5,
      diag: "in orderedList node-workflow-steps · 5 of 6",
      text: "When a request is ambiguous, open the question with reply_request on that request's thread and keep working the others — the run never stalls waiting for an answer." },
    { id: "node-workflow-doclevel", kind: "listItem", type: "step", n: 6,
      diag: "in orderedList node-workflow-steps · 6 of 6",
      text: "Work a document-level request by pinning placed notes with add_note at the specific nodes it implicates, then propose and resolve as usual." },
  ]},
  { tag: "tools", rows: [
    { id: "node-tools-intro", kind: "paragraph", type: "para",
      diag: "leads bulletList node-tools-list",
      text: "Five tools carry the loop; the semantics that matter:" },
    { spacer: true },
    { id: "node-tools-read", kind: "listItem", type: "bullet",
      diag: "in bulletList node-tools-list · 1 of 5",
      text: "read_prompt — the target document as it stands now, with node ids and the current hash." },
    { id: "node-tools-propose", kind: "listItem", type: "bullet",
      diag: "in bulletList node-tools-list · 2 of 5",
      text: "propose_transaction — one request's edit as ordered id-relative steps, compiled and validated by the service and staged as a diff for the human." },
    { id: "node-tools-resolve", kind: "listItem", type: "bullet",
      diag: "in bulletList node-tools-list · 3 of 5",
      text: "resolve_request — the only way a request leaves the queue: done or declined, always with a note." },
    { id: "node-tools-reply", kind: "listItem", type: "bullet",
      diag: "in bulletList node-tools-list · 4 of 5",
      text: "reply_request — adds to one request's thread, for questions and brief progress notes." },
    { id: "node-tools-note", kind: "listItem", type: "bullet",
      diag: "in bulletList node-tools-list · 5 of 5",
      text: "add_note — pins a new note of yours at a node, opening an inline thread the human sees." },
  ]},
];

const CONTEXT = [
  { tag: "prompt_kit_authoring", rows: [
    { id: "ctx-authoring-src", kind: "context block", type: "para",
      text: "source: prompt-kit/docs/authoring.md · 1,412 tokens · pinned for every run" },
    { id: "ctx-authoring-model", kind: "context bullet", type: "bullet",
      text: "The document model: sections hold paragraphs, bullet lists, and ordered lists; every node carries a stable id." },
    { id: "ctx-authoring-method", kind: "context bullet", type: "bullet",
      text: "The editing method: address a node by id, apply a step, let the service compile and validate the transaction." },
    { id: "ctx-authoring-anti", kind: "context bullet", type: "bullet",
      text: "Anti-patterns: rewriting whole sections, inventing ids, and shipping prose where a step was asked for." },
  ]},
  { tag: "target_prompt", rows: [
    { id: "ctx-target-head", kind: "context block", type: "para",
      text: "agent: layout-editor · base hash pk1-7f1bc2eb · 38 nodes stamped" },
    { id: "ctx-target-n1", kind: "stamped node", type: "sub",
      text: "[node-purpose-identity] You are the layout editor for {{surface}} — you shape how the surface reads." },
    { id: "ctx-target-n2", kind: "stamped node", type: "sub",
      text: "[node-purpose-frame-ast] Each surface makes intelligence legible through a typed artifact." },
    { id: "ctx-target-n3", kind: "stamped node", type: "sub",
      text: "[node-constraints-live] Apply edits to the live document immediately; the registry reloads the prompt on save." },
    { id: "ctx-target-more", kind: "elision", type: "para",
      text: "… 35 more stamped nodes elided in this preview" },
  ]},
  { tag: "requests", rows: [
    { id: "ctx-req-r1", kind: "request entry", type: "bullet",
      text: "R1 · target node-rules-voice · \"'section idiom' is vague — say what a section idiom is, or cut it.\" · thread: 0 replies" },
    { id: "ctx-req-note", kind: "context block", type: "para",
      text: "One entry, targeting a single node. No document-level request in this run." },
  ]},
];

const FIXTURES = [
  { name: "empty-run", note: "0 turns", tok: "412",
    v: { turn: "0", open: "0", resolved: "0", staged: "0", tools: "—", started: "—",
         last: "session initialized", assembled: "4,634 (2.3%)" } },
  { name: "mid-session", note: "3 turns", tok: "468",
    v: { turn: "3", open: "2", resolved: "1", staged: "1", tools: "read_prompt, propose_transaction",
         started: "3:31 PM", last: "R1 · proposal staged", assembled: "5,207 (2.6%)" } },
  { name: "long-run", note: "11 turns", tok: "531",
    v: { turn: "11", open: "1", resolved: "6", staged: "0",
         tools: "read_prompt, propose_transaction, resolve_request, reply_request, add_note",
         started: "2:58 PM", last: "R6 · resolved (declined)", assembled: "6,910 (3.5%)" } },
];

function buildState(fixture) {
  const f = FIXTURES.find((x) => x.name === fixture) || FIXTURES[0];
  const v = f.v;
  return [
    { tag: "session_state", rows: [
      { id: "state-fixture", kind: "state key", type: "kv", k: "fixture", v: f.name },
      { id: "state-agent", kind: "state key", type: "kv", k: "target_agent", v: "layout-editor" },
      { id: "state-hash", kind: "state key", type: "kv", k: "base_hash", v: "pk1-7f1bc2eb" },
      { id: "state-turn", kind: "state key", type: "kv", k: "turn", v: v.turn },
      { id: "state-open", kind: "state key", type: "kv", k: "requests_open", v: v.open },
      { id: "state-resolved", kind: "state key", type: "kv", k: "requests_resolved", v: v.resolved },
      { id: "state-staged", kind: "state key", type: "kv", k: "proposals_staged", v: v.staged },
      { id: "state-tools", kind: "state key", type: "kv", k: "tools_called", v: v.tools },
      { id: "state-started", kind: "state key", type: "kv", k: "started_at", v: v.started },
      { id: "state-last", kind: "state key", type: "kv", k: "last_event", v: v.last },
    ]},
    { tag: "budget", rows: [
      { id: "budget-window", kind: "state key", type: "kv", k: "context_window", v: "200,000" },
      { id: "budget-used", kind: "state key", type: "kv", k: "assembled", v: v.assembled },
      { id: "budget-cache", kind: "state key", type: "kv", k: "cached_prefix", v: "prompt_kit_authoring" },
    ]},
  ];
}

/* The seams between the three parts of the assembled turn. */
const SEAMS = {
  context: "Context — assembled from bundle",
  state: "State — fixture: ",
};

/* One request already on the file — review is a state of the file. */
const REQUESTS = [
  { alias: "R1", node: "node-rules-voice", status: "open",
    note: "“section idiom” is vague — define it or cut it" },
];

const HISTORY = [
  { hash: "pk1-7f1bc2eb", when: "3:42 PM", cur: true },
  { hash: "pk1-3c91d0aa", when: "2h ago", cur: false },
  { hash: "pk1-9e42b7f1", when: "yesterday", cur: false },
  { hash: "pk1-5b17c44e", when: "3d ago", cur: false },
];

const SYSTEM_TOK = "1,008";
const CONTEXT_TOK = "3,214";

/* =====================================================================
   State
   ===================================================================== */
const state = {
  fixture: "mid-session",
  parts: [],          /* [{ key, live, sections }] */
  part: "system",     /* the part the reader is standing in */
  active: null,       /* "part:tag" of the section under the reading line */
  selected: null,
  historyOpen: false,
  composerFor: null,
  nextAlias: 2,
};

const $ = (s) => document.querySelector(s);
const stageEl = $("#stage");
const sectionsEl = $("#sections");

/* =====================================================================
   Document rendering — one scroll, three parts
   ===================================================================== */
function esc(t) {
  return String(t)
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;");
}

const TOOL_RE = /\b(read_prompt|propose_transaction|resolve_request|reply_request|add_note)\b/g;

function highlight(t) {
  let h = esc(t);
  h = h.replace(/&lt;(\/?[a-z_][\w_]*)&gt;/g, '<span class="itag">&lt;$1&gt;</span>');
  h = h.replace(/\{\{([a-zA-Z]+)\}\}/g, '<span class="var">{{$1}}</span>');
  h = h.replace(TOOL_RE, '<span class="tool">$1</span>');
  return h;
}

function reqFor(id) {
  return REQUESTS.filter((r) => r.node === id);
}

function rowHtml(r, live) {
  if (r.spacer) return '<div class="row spacer"></div>';

  const pinned = live ? reqFor(r.id) : [];
  const gut = live
    ? '<button class="gut' + (pinned.length ? " pinned" : "") + '" data-gut="' + r.id +
      '" title="' + (pinned.length ? "request pinned here" : "file a request on this node") + '">' +
      (pinned.length ? "&#9679;" : "+") + "</button>"
    : '<span class="gut"></span>';

  const chips = pinned.map((p) => '<span class="rchip">' + p.alias + "</span>").join("");

  let inner;
  if (r.type === "kv") {
    inner = '<span class="kk">' + esc(r.k) + ':</span>' + chips +
      '<span class="tx">' + highlight(r.v) + "</span>";
  } else if (r.type === "bullet" || r.type === "sub") {
    inner = '<span class="mk">-</span>' + chips + '<span class="tx">' + highlight(r.text) + "</span>";
  } else if (r.type === "step") {
    inner = '<span class="mk">' + r.n + '.</span>' + chips +
      '<span class="tx">' + highlight(r.text) + "</span>";
  } else {
    inner = chips + '<span class="tx">' + highlight(r.text) + "</span>";
  }

  const sel = state.selected === r.id ? " sel" : "";
  return '<div class="row ' + r.type + sel + '" data-id="' + r.id +
    '" data-kind="' + esc(r.kind) + '" data-diag="' + esc(r.diag || "") + '">' +
    gut + '<div class="body">' + inner + "</div></div>";
}

function partHtml(part) {
  const secs = part.sections.map((s) =>
    '<section class="sec" data-part="' + part.key + '" data-tag="' + s.tag + '">' +
      '<div class="tagline">&lt;' + s.tag + "&gt;</div>" +
      s.rows.map((r) => rowHtml(r, part.live)).join("") +
      '<div class="tagline">&lt;/' + s.tag + "&gt;</div>" +
    "</section>"
  ).join("");
  return '<div class="part' + (part.live ? " live" : " ro") +
    '" data-part="' + part.key + '">' + secs + "</div>";
}

function seamHtml(key, label) {
  return '<div class="divider" data-seam="' + key + '">' + esc(label) + "</div>";
}

function renderDoc(keepScroll) {
  const top = keepScroll ? stageEl.scrollTop : 0;

  state.parts = [
    { key: "system", live: true, sections: SYSTEM },
    { key: "context", live: false, sections: CONTEXT },
    { key: "state", live: false, sections: buildState(state.fixture) },
  ];

  sectionsEl.innerHTML =
    partHtml(state.parts[0]) +
    seamHtml("context", SEAMS.context) +
    partHtml(state.parts[1]) +
    seamHtml("state", SEAMS.state + state.fixture) +
    partHtml(state.parts[2]);

  stageEl.scrollTop = top;
  state.active = null;
  state.part = null;
  spy();
}

/* =====================================================================
   Dock
   ===================================================================== */
function show(id, on) {
  document.getElementById(id).classList.toggle("gone", !on);
}

function renderDock() {
  show("zDetails", !!state.selected);
  show("zRequests", REQUESTS.length > 0);

  renderTurn();
  renderFixtures();
  renderDetails();
  renderRequests();
}

/* The turn map: the grouped outline that replaced the tab row.
   Token counts live here now, on the group heads. */
function partTok(key) {
  if (key === "system") return SYSTEM_TOK;
  if (key === "context") return CONTEXT_TOK;
  const f = FIXTURES.find((x) => x.name === state.fixture) || FIXTURES[0];
  return f.tok;
}

function renderTurn() {
  $("#turnBody").innerHTML = state.parts.map((p) =>
    '<div class="ogroup' + (p.key === state.part ? " active" : "") + '" data-group="' + p.key + '">' +
      '<button class="ghead' + (p.key === state.part ? " active" : "") + '" data-part="' + p.key + '">' +
        "<span>" + p.key + "</span><span class=\"zsp\"></span>" +
        '<span class="gc">' + partTok(p.key) + "</span>" +
      "</button>" +
      p.sections.map((s) =>
        '<button class="oitem' + (state.active === p.key + ":" + s.tag ? " active" : "") +
        '" data-part="' + p.key + '" data-sec="' + s.tag + '">' + s.tag + "</button>"
      ).join("") +
    "</div>"
  ).join("");
}

function renderFixtures() {
  const f = FIXTURES.find((x) => x.name === state.fixture) || FIXTURES[0];
  $("#fixtureBody").innerHTML =
    '<button class="fline" id="fixLine"><span class="fk">fixture:</span> ' + f.name + "</button>" +
    '<div class="flist">' + FIXTURES.map((x) =>
      '<button class="fitem' + (x.name === state.fixture ? " active" : "") +
      '" data-fix="' + x.name + '"><span>' + x.name + '</span>' +
      '<span class="zsp"></span><span class="fn">' + x.note + "</span></button>"
    ).join("") + "</div>";
}

function findRow(id) {
  for (const p of state.parts) {
    for (const s of p.sections) {
      for (const r of s.rows) if (r.id === id) return { part: p, sec: s, row: r };
    }
  }
  return null;
}

function renderDetails() {
  if (!state.selected) { $("#detailsBody").innerHTML = ""; return; }
  const found = findRow(state.selected);
  if (!found) { $("#detailsBody").innerHTML = ""; return; }
  const r = found.row;
  $("#detailsBody").innerHTML =
    '<div class="drow"><span class="dk">id</span><span class="dv id">' + esc(r.id) + "</span></div>" +
    '<div class="drow"><span class="dk">kind</span><span class="dv">' + esc(r.kind) +
      " · &lt;" + found.sec.tag + "&gt;</span></div>" +
    '<div class="drow"><span class="dk">note</span><span class="dv">' + esc(r.diag || "—") + "</span></div>";
}

function renderRequests() {
  const open = REQUESTS.filter((r) => r.status === "open").length;
  $("#reqCount").textContent = open + " open";
  $("#requestsBody").innerHTML = REQUESTS.map((r) =>
    '<button class="rrow" data-req="' + r.node + '">' +
      '<span class="rdot ' + r.status + '"></span>' +
      '<span class="ra">' + r.alias + "</span>" +
      '<span class="rt">' + esc(r.note) + "</span>" +
    "</button>"
  ).join("");
}

function renderHistory() {
  $("#historyBody").innerHTML = HISTORY.map((h) =>
    '<div class="hrow' + (h.cur ? "" : " past") + '">' +
      '<span class="hh">' + h.hash + "</span><span class=\"hsp\"></span>" +
      (h.cur ? '<span class="hcur">CURRENT</span>' : '<span class="ht">' + h.when + "</span>") +
    "</div>"
  ).join("");
}

/* =====================================================================
   Scroll spy — tracks both the part and the section inside it
   ===================================================================== */
function spy() {
  const secs = [...sectionsEl.querySelectorAll(".sec")];
  if (!secs.length) return;
  const base = stageEl.getBoundingClientRect().top;

  let curPart = secs[0].dataset.part;
  let curSec = secs[0].dataset.tag;
  for (const s of secs) {
    if (s.getBoundingClientRect().top - base <= 110) {
      curPart = s.dataset.part;
      curSec = s.dataset.tag;
    }
  }
  /* At the floor of the scroll the last section can never reach the
     reading line, so hand it the highlight outright. */
  if (stageEl.scrollTop + stageEl.clientHeight >= stageEl.scrollHeight - 4) {
    const last = secs[secs.length - 1];
    curPart = last.dataset.part;
    curSec = last.dataset.tag;
  }
  const key = curPart + ":" + curSec;
  if (key === state.active && curPart === state.part) return;

  state.active = key;
  const partChanged = curPart !== state.part;
  state.part = curPart;

  document.querySelectorAll(".oitem").forEach((o) =>
    o.classList.toggle("active", o.dataset.part + ":" + o.dataset.sec === key));

  if (partChanged) {
    document.querySelectorAll(".ogroup").forEach((g) =>
      g.classList.toggle("active", g.dataset.group === curPart));
    document.querySelectorAll(".ghead").forEach((h) =>
      h.classList.toggle("active", h.dataset.part === curPart));
    /* FIXTURE stays mounted but only opens up where it applies. */
    $("#zFixture").classList.toggle("expanded", curPart === "state");
  }
}

stageEl.addEventListener("scroll", spy);

function scrollToEl(el, offset) {
  const top = el.getBoundingClientRect().top - stageEl.getBoundingClientRect().top +
    stageEl.scrollTop - offset;
  stageEl.scrollTo({ top: Math.max(0, top), behavior: "smooth" });
}

function scrollToSection(part, tag) {
  const sec = sectionsEl.querySelector(
    '.sec[data-part="' + part + '"][data-tag="' + tag + '"]');
  if (sec) scrollToEl(sec, 24);
}

function scrollToPart(part) {
  if (part === "system") { stageEl.scrollTo({ top: 0, behavior: "smooth" }); return; }
  const seam = sectionsEl.querySelector('.divider[data-seam="' + part + '"]');
  if (seam) scrollToEl(seam, 18);
}

/* =====================================================================
   Selection · details — the prompt is the only editable part
   ===================================================================== */
sectionsEl.addEventListener("click", (e) => {
  if (e.target.closest(".gut") || e.target.closest(".composer")) return;
  const part = e.target.closest(".part");
  if (!part || part.dataset.part !== "system") return;
  const row = e.target.closest(".row");
  if (!row || !row.dataset.id) return;
  state.selected = state.selected === row.dataset.id ? null : row.dataset.id;
  renderDoc(true);
  renderDock();
});

/* =====================================================================
   Gutter → inline composer → request
   ===================================================================== */
function closeComposer() {
  const c = sectionsEl.querySelector(".composer");
  if (c) c.remove();
  state.composerFor = null;
}

function openComposer(id) {
  const row = sectionsEl.querySelector('.row[data-id="' + id + '"]');
  if (!row) return;
  closeComposer();
  state.composerFor = id;

  const box = document.createElement("div");
  box.className = "composer";
  box.innerHTML =
    '<input class="cin" type="text" placeholder="what should change here?" />' +
    '<div class="chint">Enter to file &middot; Esc to cancel</div>';
  row.parentNode.insertBefore(box, row);

  const input = box.querySelector(".cin");
  input.focus();
  input.addEventListener("keydown", (e) => {
    if (e.key === "Escape") { e.preventDefault(); closeComposer(); }
    if (e.key === "Enter") {
      e.preventDefault();
      const note = input.value.trim();
      if (!note) { closeComposer(); return; }
      fileRequest(id, note);
    }
  });
}

function fileRequest(id, note) {
  const alias = "R" + state.nextAlias++;
  REQUESTS.push({ alias: alias, node: id, status: "open", note: note });
  closeComposer();
  renderDoc(true);
  renderDock();
  flash(id);
}

function flash(id) {
  const row = sectionsEl.querySelector('.row[data-id="' + id + '"]');
  if (!row) return;
  row.classList.add("flash");
  setTimeout(() => row.classList.remove("flash"), 1100);
}

sectionsEl.addEventListener("click", (e) => {
  const gut = e.target.closest("button.gut");
  if (!gut || !gut.dataset.gut) return;
  e.stopPropagation();
  if (state.composerFor === gut.dataset.gut) { closeComposer(); return; }
  openComposer(gut.dataset.gut);
});

document.addEventListener("keydown", (e) => {
  if (e.key === "Escape" && state.composerFor) closeComposer();
});

/* =====================================================================
   Dock interactions
   ===================================================================== */
$("#turnBody").addEventListener("click", (e) => {
  const item = e.target.closest(".oitem");
  if (item) { scrollToSection(item.dataset.part, item.dataset.sec); return; }
  const head = e.target.closest(".ghead");
  if (head) scrollToPart(head.dataset.part);
});

$("#requestsBody").addEventListener("click", (e) => {
  const rr = e.target.closest(".rrow");
  if (!rr) return;
  const row = sectionsEl.querySelector('.row[data-id="' + rr.dataset.req + '"]');
  if (!row) return;
  scrollToEl(row, 160);
  flash(rr.dataset.req);
});

$("#fixtureBody").addEventListener("click", (e) => {
  const fi = e.target.closest(".fitem");
  if (fi) {
    state.fixture = fi.dataset.fix;
    renderDoc(true);
    renderDock();
    return;
  }
  /* collapsed one-liner: take me to the part it describes */
  if (e.target.closest("#fixLine")) scrollToPart("state");
});

$("#histHead").addEventListener("click", () => {
  state.historyOpen = !state.historyOpen;
  $("#zHistory").classList.toggle("closed", !state.historyOpen);
});

/* =====================================================================
   Boot
   ===================================================================== */
renderDoc(false);
renderDock();
renderHistory();
spy();
</script>
</body>
</html>
