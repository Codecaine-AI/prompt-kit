<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Prompt editor — readability explorations</title>
<style>
  :root {
    --bg: #161616;
    --chrome: #1e1e1e;
    --fg: #e4e4e2;
    --dim: #8a919c;
    --accent: #4d9de0;
    --ring: rgb(255 255 255 / 0.08);
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--fg);
    font: 13px/1.5 ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
    -webkit-font-smoothing: antialiased;
    display: flex;
    flex-direction: column;
  }
  header {
    flex: none;
    display: flex;
    align-items: center;
    gap: 16px;
    padding: 10px 16px;
    background: var(--chrome);
    box-shadow: 0 1px 0 var(--ring);
  }
  header h1 {
    font-size: 13px;
    font-weight: 600;
    margin: 0;
    letter-spacing: 0.02em;
  }
  nav { display: flex; gap: 6px; }
  nav button {
    appearance: none;
    border: 1px solid transparent;
    background: transparent;
    color: var(--dim);
    font: inherit;
    padding: 5px 12px;
    border-radius: 6px;
    cursor: pointer;
  }
  nav button:hover { color: var(--fg); background: rgb(255 255 255 / 0.05); }
  nav button[aria-selected="true"] {
    color: var(--fg);
    background: rgb(255 255 255 / 0.06);
    border-color: var(--ring);
  }
  nav button b { color: var(--accent); font-weight: 600; margin-right: 6px; }
  .hint { margin-left: auto; color: var(--dim); font-size: 12px; }
  main { flex: 1; position: relative; }
  iframe {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    border: 0;
    background: var(--bg);
    display: none;
  }
  iframe.active { display: block; }
</style>
</head>
<body>
  <header>
    <h1>prompt-editor readability</h1>
    <nav id="tabs" role="tablist"></nav>
    <span class="hint">1–9 or ←/→ to cycle</span>
  </header>
  <main id="stage"></main>
<script>
  const VARIANTS = [
    { key: "A", label: "Measure &amp; Rhythm", file: "variant-a-rhythm.html" },
    { key: "B", label: "Quiet Structure", file: "variant-b-quiet-structure.html" },
    { key: "C", label: "Wayfinding", file: "variant-c-wayfinding.html" },
    { key: "D", label: "Two Voices", file: "variant-d-two-voice.html" },
    { key: "E", label: "Quiet Rail", file: "variant-e-quiet-rail.html" },
    { key: "F", label: "Quiet Atlas", file: "variant-f-quiet-atlas.html" },
    { key: "G", label: "Quiet Landmarks", file: "variant-g-quiet-landmarks.html" },
    { key: "H", label: "Painted Landmarks", file: "variant-h-painted-landmarks.html" },
    { key: "I", label: "Tinted Landmarks", file: "variant-i-tinted-landmarks.html" },
  ];
  const tabs = document.getElementById("tabs");
  const stage = document.getElementById("stage");
  const frames = [];
  VARIANTS.forEach((v, i) => {
    const b = document.createElement("button");
    b.role = "tab";
    b.innerHTML = `<b>${v.key}</b>${v.label}`;
    b.addEventListener("click", () => select(i));
    tabs.appendChild(b);
    const f = document.createElement("iframe");
    f.title = `${v.key} — ${v.label}`;
    stage.appendChild(f);
    frames.push(f);
  });
  let current = -1;
  function select(i) {
    current = (i + VARIANTS.length) % VARIANTS.length;
    frames.forEach((f, j) => {
      if (j === current && !f.src) f.src = VARIANTS[j].file;
      f.classList.toggle("active", j === current);
    });
    [...tabs.children].forEach((b, j) =>
      b.setAttribute("aria-selected", j === current ? "true" : "false"));
  }
  addEventListener("keydown", (e) => {
    if (e.target.closest("input, textarea")) return;
    if (e.key >= "1" && e.key <= "9") select(Number(e.key) - 1);
    else if (e.key === "ArrowRight") select(current + 1);
    else if (e.key === "ArrowLeft") select(current - 1);
  });
  select(0);
</script>
</body>
</html>
