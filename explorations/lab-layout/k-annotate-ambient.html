    '<div class="drow"><span class="dk">kind</span><span class="dv">' + esc(r.kind) +
      " · &lt;" + found.sec.tag + "&gt;</span></div>" +
    '<div class="drow"><span class="dk">note</span><span class="dv">' + esc(r.diag || "—") + "</span></div>";
}

/* =====================================================================
   THE STATE VOCABULARY — one set of words, used by the dock, the queue
   cards and both threads:
     queued → processing → staged → resolved
     open   → sending → agent working → staged → resolved
   ===================================================================== */
function stateText(r, withEll) {
  if (r.st === "sending") return "sending" + (withEll ? ELL : "…");
  if (r.st === "working") return "agent working" + (withEll ? ELL : "…");
  if (r.st === "processing") return "processing" + (withEll ? ELL : "…");
  if (r.st === "staged") return "staged";
  if (r.st === "resolved") return "resolved";
  if (r.st === "discarded") return "discarded";
  if (r.st === "queued") return "queued";
  return "open";
}

/* the queue's own position language, only for what has not started */
function queueText(r) {
  if (r.st !== "queued") return stateText(r, true);
  const i = queuedItems().indexOf(r);
  if (i <= 0) return "queued &middot; next";
  return "queued &middot; #" + (i + 1);
}

function stateClass(r) {
  if (r.st === "sending" || r.st === "working" || r.st === "processing") return " act";
  if (r.st === "staged") return " stg";
  return "";
}

function renderRequests() {
  $("#reqCount").textContent = queueItems().length + " queued";
  $("#requestsBody").innerHTML = REQUESTS.map((r) =>
    '<button class="rrow" data-req="' + r.alias + '">' +
      '<span class="sdot ' + r.st + '"></span>' +
      '<span class="ra">' + r.alias + "</span>" +
      '<span class="rt">' + esc(tidy(r.note)) + "</span>" +
      '<span class="rs">' + stateText(r, true) + "</span>" +
    "</button>"
  ).join("");
}

function renderHistory() {
  $("#historyBody").innerHTML = HISTORY.map((h) =>
    '<div class="hrow' + (h.cur ? "" : " past") + '">' +
      '<span class="hh">' + h.hash + "</span><span class=\"hsp\"></span>" +
      (h.cur ? '<span class="hcur">CURRENT</span>' : '<span class="ht">' + h.when + "</span>") +
    "</div>"
  ).join("");
}

/* the whisper carries the save when the mode is not on */
function renderStatus() {
  $("#status").textContent = (!state.annot && state.view === "system") ? "saved 3:42 PM" : "";
}

/* =====================================================================
   Scroll spy
   ===================================================================== */
function spy() {
  const secs = [...sectionsEl.querySelectorAll(".sec")];
  if (!secs.length) return;
  const base = stageEl.getBoundingClientRect().top;
  let cur = secs[0].dataset.tag;
  for (const s of secs) {
    if (s.getBoundingClientRect().top - base <= 110) cur = s.dataset.tag;
  }
  if (cur === state.active) return;
  state.active = cur;
  document.querySelectorAll(".oitem").forEach((o) =>
    o.classList.toggle("active", o.dataset.sec === cur));
}

stageEl.addEventListener("scroll", spy);

function scrollToEl(el, offset) {
  const top = el.getBoundingClientRect().top - stageEl.getBoundingClientRect().top +
    stageEl.scrollTop - offset;
  stageEl.scrollTo({ top: Math.max(0, top), behavior: "smooth" });
}

function scrollToNode(id, offset) {
  if (!id) return;
  const row = sectionsEl.querySelector('.row[data-id="' + id + '"]');
  if (row) scrollToEl(row, offset === undefined ? 190 : offset);
}

function flash(id) {
  if (!id) return;
  const row = sectionsEl.querySelector('.row[data-id="' + id + '"]');
  if (!row) return;
  row.classList.add("flash");
  setTimeout(() => row.classList.remove("flash"), 1100);
}

function renderAll(keepScroll) {
  renderDoc(keepScroll !== false);
  renderPanel();
  renderDock();
  syncChip();
}

/* =====================================================================
   View switching — the mode pins the view to System
   ===================================================================== */
function setView(view) {
  if (state.view === view) return;
  if (state.annot && view !== "system") return;
  state.view = view;
  state.selected = null;
  closeComposer();
  renderDoc(false);
  renderDock();
  renderStatus();
}

$("#viewBody").addEventListener("click", (e) => {
  const item = e.target.closest(".vitem");
  if (!item) return;
  setView(item.dataset.view);
});

/* =====================================================================
   Selection · details
   ===================================================================== */
sectionsEl.addEventListener("click", (e) => {
  if (e.target.closest(".gut") || e.target.closest(".composer") || e.target.closest(".ithread")) return;
  if (state.view !== "system") return;
  const row = e.target.closest(".row");
  if (!row || !row.dataset.id) return;

  /* inside the mode, clicking a queued row changes the sidebar's subject */
  if (state.annot) {
    const owner = stagedFor(row.dataset.id) || pinnedFor(row.dataset.id)[0];
    if (owner && isQueue(owner)) openCard(owner.alias);
    return;
  }

  state.selected = state.selected === row.dataset.id ? null : row.dataset.id;
  renderDoc(true);
  renderDock();
});

/* =====================================================================
   THE COMPOSER — one opening, three dispositions
   ===================================================================== */
function closeComposer() {
  state.composer = null;
  if (state.focus === "composer") state.focus = null;
}

function openComposer(id, sel) {
  if (!state.annot) return;
  if (state.composer && state.composer.node === id) { closeComposer(); renderDoc(true); return; }
  state.composer = { node: id || null, sel: sel || "", text: "" };
  state.focus = "composer";
  renderDoc(true);
  if (id) scrollToNode(id, 240);
}

sectionsEl.addEventListener("click", (e) => {
  const gut = e.target.closest(".gut");
  if (!gut || !gut.dataset.gut) return;
  e.stopPropagation();
  openComposer(gut.dataset.gut, "");
});

/* keep the draft in state so a re-render never eats it */
docEl.addEventListener("input", (e) => {
  if (e.target.classList.contains("cin")) {
    if (state.composer) state.composer.text = e.target.value;
    return;
  }
  if (e.target.classList.contains("irep")) {
    state.replies[e.target.dataset.rep] = e.target.value;
  }
});

docEl.addEventListener("focusin", (e) => {
  if (e.target.classList.contains("cin")) state.focus = "composer";
  else if (e.target.classList.contains("irep")) state.focus = "rep:" + e.target.dataset.rep;
});

docEl.addEventListener("keydown", (e) => {
  if (e.target.classList.contains("cin")) {
    if (e.key === "Escape") {
      e.preventDefault(); e.stopPropagation();
      closeComposer(); renderDoc(true);
      return;
    }
    if (e.key !== "Enter") return;
    e.preventDefault();
    const global = !state.composer || !state.composer.node;
    if (global) { fileNote("global"); return; }
    if (e.metaKey || e.ctrlKey) { fileNote("global"); return; }
    if (e.shiftKey) { fileNote("batch"); return; }
    fileNote("run");
    return;
  }
  if (e.target.classList.contains("irep")) {
    if (e.key === "Escape") { e.preventDefault(); e.stopPropagation(); e.target.blur(); state.focus = null; return; }
    if (e.key !== "Enter" || e.shiftKey) return;
    e.preventDefault();
    const alias = e.target.dataset.rep;
    const text = (state.replies[alias] || e.target.value || "").trim();
    if (!text) return;
    replyRun(alias, text);
  }
});

docEl.addEventListener("click", (e) => {
  const act = e.target.closest(".cact");
  if (act) { e.stopPropagation(); fileNote(act.dataset.do); return; }
  const acc = e.target.closest(".iact.acc");
  if (acc) { e.stopPropagation(); acceptRun(acc.dataset.acc); return; }
  const dis = e.target.closest(".iact.dis");
  if (dis) { e.stopPropagation(); discardRun(dis.dataset.dis); return; }
});

/* =====================================================================
   FILING — the three gestures diverge here
   ===================================================================== */
function fileNote(how) {
  const c = state.composer;
  if (!c) return;
  const text = tidy(c.text || "");
  if (!text) { closeComposer(); renderDoc(true); return; }

  const alias = "R" + state.nextAlias++;
  const global = how === "global";
  const r = {
    alias: alias,
    mode: how === "run" ? "run" : (global ? "global" : "batch"),
    node: global ? null : c.node,
    st: how === "run" ? "open" : "queued",
    note: text,
    when: clock(),
    thread: [{ who: "you", t: clock(), text: text }],
    diff: null,
    stage: null,
    conflict: false,
    sel: c.sel || "",
  };
  REQUESTS.push(r);
  closeComposer();

  if (how === "run") {
    /* run now never touches the sidebar — the work happens at the row */
    state.focus = null;
    runNow(r);
    return;
  }

  /* batch and global file instantly, and nothing runs */
  state.card = alias;
  state.focus = null;
  renderAll(true);
  if (r.node) flash(r.node);
}

/* =====================================================================
   RUN NOW — the loop that lives at the section
   sending → agent working (shimmer) → the reply lands whole → diff stages
   ===================================================================== */
function synthStage(r, node) {
  const id = node || r.node;
  const found = findRow(id);
  if (!found) return null;
  const base = tidy(found.row.text).replace(/\.\s*$/, "");
  const note = tidy(r.note).replace(/\.\s*$/, "");
  return {
    say: "Read that node against your note. Staged one clause on " + shortId(id) +
      " — nothing else in the section is touched.",
    new: base + " — " + note.charAt(0).toLowerCase() + note.slice(1) + ".",
  };
}

/* the scripted second iteration: a reply that asks for less gets less */
function tighten(t) {
  const orig = tidy(t);
  let s = orig.replace(/\.\s*$/, "");
  const head = s.split(/\s+—\s+|,\s+(?:and|because|so|which)\s+/)[0];
  if (head && head.length > 28) s = head;
  if (s.length >= orig.length - 2) {
    s = orig.slice(0, Math.max(44, Math.floor(orig.length * 0.55))).replace(/\s+\S*$/, "");
  }
  return s.replace(/[,;:—\s]+$/, "") + ".";
}

function revise(r, text) {
  const base = r.diff ? r.diff.new : (findRow(r.node) || { row: { text: "" } }).row.text;
  if (/tight|short|terse|trim|cut|brief|less|smaller/i.test(text)) {
    return {
      say: "Tighter. Dropped the trailing clause and the qualifier — one sentence, same rule.",
      new: tighten(base),
    };
  }
  return {
    say: "Reworked the staged clause on " + shortId(r.node) + " against that, and left the rest alone.",
    new: tidy(base).replace(/\.\s*$/, "") + " — " + tidy(text).toLowerCase().replace(/\.$/, "") + ".",
  };
}

function runNow(r) {
  const spec = r.pending || synthStage(r);
  r.pending = null;
  if (!spec) return;

  r.st = "sending";
  renderAll(true);
  scrollToNode(r.node, 240);

  clearTimeout(r.timer);
  r.timer = setTimeout(() => {
    r.st = "working";                       /* the row shimmers from here */
    renderAll(true);

    clearTimeout(r.timer);
    r.timer = setTimeout(() => {
      r.thread.push({ who: "agent", t: clock(), text: spec.say });
      r.diff = { node: r.node, new: spec.new };
      r.st = "staged";
      state.newMsg = r.alias;
      state.fresh = r.alias;
      renderAll(true);
      setTimeout(() => { state.fresh = null; state.newMsg = null; }, 900);
    }, 2000);
  }, 380);
}

function replyRun(alias, text) {
  const r = reqBy(alias);
  if (!r) return;
  r.thread.push({ who: "you", t: clock(), text: text });
  r.pending = revise(r, text);
  r.diff = null;                            /* the old stage comes off the row */
  state.replies[alias] = "";
  state.focus = null;
  runNow(r);
}

/* the thread folds away before the row is re-rendered without it */
function collapseIthread(alias, then) {
  const el = docEl.querySelector('.ithread[data-ith="' + alias + '"]');
  if (!el) { then(); return; }
  el.style.height = el.offsetHeight + "px";
  el.classList.add("out");
  requestAnimationFrame(() => {
    el.style.height = "0px";
    el.style.opacity = "0";
    el.style.marginTop = "0px";
    el.style.marginBottom = "0px";
  });
  setTimeout(then, 230);
}

/* a run-now accept changes a node other notes may already be aimed at */
function markConflicts(node, byAlias) {
  REQUESTS.forEach((r) => {
    if (isQueue(r) && r.st === "queued" && r.node === node) {
      r.conflict = true;
      r.conflictBy = byAlias;
    }
  });
}

function fileRecord(r) {
  state.freshRec = r.alias;
  setTimeout(() => { state.freshRec = null; }, 900);
}

function acceptRun(alias) {
  const r = reqBy(alias);
  if (!r || !r.diff) return;
  const node = r.diff.node;
  const found = findRow(node);
  if (found) found.row.text = r.diff.new;
  r.diff = null;
  r.st = "resolved";
  r.when = clock();
  r.hash = "pk1-" + Math.random().toString(16).slice(2, 10);
  r.thread.push({ who: "agent", t: clock(),
    text: "Accepted — landed on " + shortId(node) + " as " + r.hash + "." });

  markConflicts(node, r.alias);

  HISTORY.forEach((h) => { if (h.cur) { h.cur = false; h.when = "moments ago"; } });
  HISTORY.unshift({ hash: r.hash, when: "just now", cur: true });
  state.historyOpen = true;
  $("#zHistory").classList.remove("closed");

  fileRecord(r);
  collapseIthread(alias, () => {
    renderAll(true);
    renderHistory();
    flash(node);
  });
}

function discardRun(alias) {
  const r = reqBy(alias);
  if (!r || !r.diff) return;
  const node = r.diff.node;
  r.diff = null;
  r.st = "discarded";
  r.when = clock();
  r.thread.push({ who: "you", t: clock(), text: "Discarded that proposal." });
  fileRecord(r);
  collapseIthread(alias, () => {
    renderAll(true);
    flash(node);
  });
}

/* =====================================================================
   THE BATCH — filed instantly, run only on Apply, narrated one at a time
   ===================================================================== */
function applyQueue() {
  if (state.applying) return;
  if (!queuedItems().length) return;
  state.applying = true;
  advanceQueue();
}

function advanceQueue() {
  const next = queuedItems()[0];
  if (!next) { state.applying = false; renderAll(true); return; }

  next.st = "processing";
  state.card = next.alias;
  renderAll(true);
  const shownNode = next.stage && next.stage.node ? next.stage.node : next.node;
  if (shownNode) scrollToNode(shownNode, 220);

  clearTimeout(next.timer);
  next.timer = setTimeout(() => {
    const spec = next.stage || synthStage(next, next.node);
    next.stage = null;
    if (!spec) { next.st = "queued"; state.applying = false; renderAll(true); return; }

    const node = spec.node || next.node;
    next.thread.push({ who: "agent", t: clock(), text: spec.say });
    next.diff = { node: node, new: spec.new };
    next.st = "staged";
    state.newMsg = next.alias;
    state.fresh = next.alias;
    renderAll(true);
    setTimeout(() => { state.fresh = null; state.newMsg = null; }, 900);

    setTimeout(advanceQueue, 780);
  }, 1800);
}

function acceptCard(alias) {
  const r = reqBy(alias);
  if (!r || !r.diff) return;
  const node = r.diff.node;
  const found = findRow(node);
  if (found) found.row.text = r.diff.new;
  r.diff = null;
  r.st = "resolved";
  r.when = clock();
  r.hash = "pk1-" + Math.random().toString(16).slice(2, 10);
  r.thread.push({ who: "agent", t: clock(),
    text: "Accepted — landed on " + shortId(node) + " as " + r.hash + "." });
  markConflicts(node, r.alias);

  HISTORY.forEach((h) => { if (h.cur) { h.cur = false; h.when = "moments ago"; } });
  HISTORY.unshift({ hash: r.hash, when: "just now", cur: true });
  $("#zHistory").classList.remove("closed");
  state.historyOpen = true;

  fileRecord(r);
  const nxt = queueItems()[0];
  state.card = nxt ? nxt.alias : null;
  renderAll(true);
  renderHistory();
  flash(node);
}

function discardCard(alias) {
  const r = reqBy(alias);
  if (!r || !r.diff) return;
  const node = r.diff.node;
  r.diff = null;
  r.st = "discarded";
  r.when = clock();
  r.thread.push({ who: "you", t: clock(), text: "Discarded that proposal." });
  fileRecord(r);
  const nxt = queueItems()[0];
  state.card = nxt ? nxt.alias : null;
  renderAll(true);
  flash(node);
}

/* =====================================================================
   THE PANEL — the queue, and the records the run-now loop leaves behind
   ===================================================================== */
function threadHtml(r) {
  let out = r.thread.map((m, i) => {
    const fresh = (state.newMsg === r.alias && i === r.thread.length - 1) ? " new" : "";
    return '<div class="tmsg ' + m.who + fresh + '">' +
      '<div class="tmeta"><span class="who ' + m.who + '">' + m.who + "</span>" +
      '<span class="tsp"></span><span>' + esc(m.t) + "</span></div>" +
      '<div class="tbody">' + esc(m.text) + "</div>" +
    "</div>";
  }).join("");

  if (r.st === "processing") out += '<div class="tstate">' + stateText(r, true) + "</div>";

  if (r.st === "staged" && r.diff) {
    out +=
      '<div class="tacts">' +
        '<span class="tstaged"><span class="tsq">&#9612;</span>staged on ' +
          esc(shortId(r.diff.node)) + "</span>" +
        '<button class="tact acc" data-acc="' + r.alias + '">Accept</button>' +
        '<button class="tact dis" data-dis="' + r.alias + '">Discard</button>' +
      "</div>";
  }

  return '<div class="thread" data-thread="' + r.alias + '">' + out + "</div>";
}

function cardHtml(r) {
  const on = state.card === r.alias;
  const meta = [];
  if (r.mode === "global") meta.push('<span class="tchip">document</span>');
  else meta.push('<span class="ck">target</span><span class="cv">' + esc(shortId(r.node)) + "</span>");
  if (r.conflict) {
    meta.push('<span class="wchip" title="' + esc(r.conflictBy || "") +
      ' changed this node after the note was filed">target changed since filed</span>');
  }

  const head =
    '<button class="card' + (on ? " on" : "") + '" data-card="' + r.alias + '">' +
      '<span class="cline">' +
        '<span class="sdot ' + r.st + '"></span>' +
        '<span class="ca">' + r.alias + "</span>" +
        '<span class="csp"></span>' +
        '<span class="cst' + stateClass(r) + '">' + queueText(r) + "</span>" +
      "</span>" +
      '<span class="cnote">' + esc(tidy(r.note)) + "</span>" +
      '<span class="cmeta">' + meta.join("") + "</span>" +
    "</button>";
  return head + (on ? threadHtml(r) : "");
}

function recHtml(r) {
  const ok = r.st === "resolved";
  const node = r.mode === "global" ? "document" : shortId(r.diff ? r.diff.node : r.node);
  return '<div class="rec' + (ok ? "" : " no") + (state.freshRec === r.alias ? " fresh" : "") + '">' +
    '<span class="rmk">' + (ok ? "&#10003;" : "&#10005;") + "</span>" +
    '<span class="rca">' + r.alias + "</span>" +
    '<span class="rsep">&middot;</span>' +
    '<span class="rnode">' + esc(node) + "</span>" +
    '<span class="rsep">&middot;</span>' +
    '<span class="rst">' + (ok ? "resolved" : "discarded") + "</span>" +
  "</div>";
}

/* the pipeline line: what is running, what is waiting, what is staged */
function renderProgress() {
  const p = processingItem();
  const run = runInFlight()[0];
  const nq = queuedItems().length;
  const ns = stagedItems().length;

  const parts = [];
  if (p) parts.push("processing " + p.alias);
  if (run) parts.push("running " + run.alias + " inline");
  if (nq) parts.push(nq + " queued");
  if (ns) parts.push(ns + " staged");

  $("#progText").textContent = parts.length ? parts.join(" · ") : "queue idle";

  const done = records().length;
  $("#progNote").textContent = done ? done + " resolved" : "";

  const total = queueItems().length + records().length;
  $("#pfill").style.width = (total ? Math.round((done / total) * 100) : 0) + "%";
}

function syncChip() {
  chipDot.classList.toggle("fast", busy());
}

function renderPanel() {
  renderProgress();

  const q = queueItems();
  const recs = records();
  const canApply = !state.applying && queuedItems().length > 0;

  let html =
    '<div class="lhead top"><span>Queue</span><span class="lsp"></span>' +
      '<button class="qapply' + (canApply ? "" : " off") + '" id="applyQ">' +
        (state.applying ? "running" : "Apply") + "</button>" +
    "</div>";

  html += q.length
    ? q.map(cardHtml).join("")
    : '<div class="lempty">nothing queued — ⇧Enter in a composer files here</div>';

  html += '<div class="lhead"><span>Requests</span><span class="lsp"></span>' +
    '<span class="ck">' + recs.length + "</span></div>";
  html += recs.length
    ? recs.map(recHtml).join("")
    : '<div class="lempty">no requests disposed yet</div>';

  const top = listEl.scrollTop;
  listEl.innerHTML = html;
  listEl.scrollTop = top;

  /* the panel composer follows whatever the sidebar has open */
  const cur = reqBy(state.card);
  if (cur && cur.st === "staged") {
    msgEl.placeholder = "Reply on " + cur.alias + " — Enter to re-run";
    hintEl.textContent = "Enter replies on " + cur.alias + " · Esc to finish";
  } else {
    msgEl.placeholder = "Note about the whole document — Enter files it to global";
    hintEl.textContent = "Enter files to global · Esc to finish";
  }

  syncChip();
}

function openCard(alias) {
  state.card = state.card === alias ? null : alias;
  const r = reqBy(alias);
  renderPanel();
  renderDoc(true);
  if (r && state.card === alias) {
    const node = r.diff ? r.diff.node : r.node;
    if (node) { scrollToNode(node); flash(node); }
  }
}

/* a reply in the sidebar re-runs whatever batch card is open and staged */
function replyCard(alias, text) {
  const r = reqBy(alias);
  if (!r || !r.diff) return;
  r.thread.push({ who: "you", t: clock(), text: text });
  const node = r.diff.node;
  const revised = /tight|short|terse|trim|cut|brief|less|smaller/i.test(text)
    ? { say: "Tighter. One sentence, same rule.", new: tighten(r.diff.new) }
    : { say: "Reworked the staged clause against that.",
        new: tidy(r.diff.new).replace(/\.\s*$/, "") + " — " + tidy(text).toLowerCase().replace(/\.$/, "") + "." };

  r.diff = null;
  r.st = "processing";
  renderAll(true);

  clearTimeout(r.timer);
  r.timer = setTimeout(() => {
    r.thread.push({ who: "agent", t: clock(), text: revised.say });
    r.diff = { node: node, new: revised.new };
    r.st = "staged";
    state.newMsg = r.alias;
    state.fresh = r.alias;
    renderAll(true);
    setTimeout(() => { state.fresh = null; state.newMsg = null; }, 900);
  }, 1600);
}

/* the panel composer: a reply on an open staged card, else a global note */
function sendPanel(text) {
  const cur = reqBy(state.card);
  if (cur && cur.st === "staged") { replyCard(cur.alias, text); return; }

  const alias = "R" + state.nextAlias++;
  const r = {
    alias: alias, mode: "global", node: null, st: "queued",
    note: text, when: clock(),
    thread: [{ who: "you", t: clock(), text: text }],
    diff: null, stage: null, conflict: false,
  };
  REQUESTS.push(r);
  state.card = alias;
  renderAll(true);
}

/* =====================================================================
   ENTER · EXIT — one class, one transition, the whole surface
   ===================================================================== */
let chipTimer = null;
let chipClear = null;

function enterAnnotate() {
  if (state.annot) return;
  if (state.view !== "system") setView("system");
  state.annot = true;
  state.selected = null;

  const cur = reqBy(state.card);
  if (!cur || !isQueue(cur) || cur.st === "resolved" || cur.st === "discarded") {
    const next = queueItems()[0];
    state.card = next ? next.alias : null;
  }

  root.classList.add("mode-annotate");   /* (a)(b)(c)(d), all at once */
  dockEl.classList.add("hid");
  chatEl.classList.add("on");

  clearTimeout(chipTimer);
  clearTimeout(chipClear);
  chipEl.classList.remove("saved");
  chipText.textContent = "annotating — esc to finish";
  chipEl.classList.add("show");

  renderAll(true);
  renderStatus();

  /* open onto the thing being discussed, not a paragraph nobody named */
  const cur2 = reqBy(state.card);
  const node = cur2 ? (cur2.diff ? cur2.diff.node : cur2.node) : null;
  if (node) {
    scrollToNode(node, 200);
    setTimeout(() => flash(node), 240);
  }
}

function exitAnnotate() {
  if (!state.annot) return;
  state.annot = false;
  closeComposer();
  state.focus = null;

  root.classList.remove("mode-annotate");
  chatEl.classList.remove("on");
  dockEl.classList.remove("hid");

  renderDoc(true);
  renderDock();
  renderStatus();

  /* the chip morphs into what the session left behind, then goes */
  const n = stagedItems().length;
  chipEl.classList.add("saved");
  chipText.textContent = "saved · " + n + " change" + (n === 1 ? "" : "s") + " staged";
  clearTimeout(chipTimer);
  clearTimeout(chipClear);
  chipTimer = setTimeout(() => {
    chipEl.classList.remove("show");
    chipClear = setTimeout(() => chipEl.classList.remove("saved"), 320);
  }, 2000);
}

$("#goAnnot").addEventListener("click", (e) => {
  e.stopPropagation();
  enterAnnotate();
});
$("#chatDone").addEventListener("click", exitAnnotate);

/* =====================================================================
   Wiring
   ===================================================================== */
listEl.addEventListener("click", (e) => {
  if (e.target.closest("#applyQ")) { e.stopPropagation(); applyQueue(); return; }
  const acc = e.target.closest(".tact.acc");
  if (acc) { e.stopPropagation(); acceptCard(acc.dataset.acc); return; }
  const dis = e.target.closest(".tact.dis");
  if (dis) { e.stopPropagation(); discardCard(dis.dataset.dis); return; }
  const card = e.target.closest(".card");
  if (!card) return;
  openCard(card.dataset.card);
});

msgEl.addEventListener("keydown", (e) => {
  if (e.key === "Escape") {
    e.preventDefault();
    if (msgEl.value.trim()) { msgEl.value = ""; return; }
    exitAnnotate();
    return;
  }
  if (e.key !== "Enter" || e.shiftKey) return;
  e.preventDefault();
  const text = tidy(msgEl.value);
  if (!text) return;
  msgEl.value = "";
  sendPanel(text);
});

/* ⌘K — with a selection it targets that row, without one it goes global */
function rowFromSelection() {
  const sel = window.getSelection();
  if (!sel || sel.isCollapsed || !sel.rangeCount) return null;
  let n = sel.anchorNode;
  if (n && n.nodeType === 3) n = n.parentElement;
  if (!n || !n.closest) return null;
  const row = n.closest(".row");
  if (!row || !row.dataset.id) return null;
  return { id: row.dataset.id, text: tidy(sel.toString()) };
}

document.addEventListener("keydown", (e) => {
  if ((e.metaKey || e.ctrlKey) && (e.key === "k" || e.key === "K")) {
    e.preventDefault();
    if (!state.annot) enterAnnotate();
    const hit = rowFromSelection();
    if (hit && hit.text) openComposer(hit.id, hit.text);
    else openComposer(null, "");
    return;
  }
  if (e.key !== "Escape") return;
  if (state.composer) { closeComposer(); renderDoc(true); return; }
  if (state.annot && document.activeElement !== msgEl &&
      !(document.activeElement && document.activeElement.classList &&
        document.activeElement.classList.contains("irep"))) {
    exitAnnotate();
  }
});

$("#outlineBody").addEventListener("click", (e) => {
  const item = e.target.closest(".oitem");
  if (!item) return;
  const sec = sectionsEl.querySelector('.sec[data-tag="' + item.dataset.sec + '"]');
  if (sec) scrollToEl(sec, 24);
});

/* a request in the dock is a door into the mode, already on that card */
$("#requestsBody").addEventListener("click", (e) => {
  const rr = e.target.closest(".rrow");
  if (!rr) return;
  state.card = rr.dataset.req;
  enterAnnotate();
  const r = reqBy(rr.dataset.req);
  const node = r ? (r.diff ? r.diff.node : r.node) : null;
  if (node) { scrollToNode(node); flash(node); }
});

$("#fixtureBody").addEventListener("click", (e) => {
  const fi = e.target.closest(".fitem");
  if (!fi) return;
  state.fixture = fi.dataset.fix;
  renderDoc(false);
  renderDock();
  renderStatus();
});

$("#histHead").addEventListener("click", () => {
  state.historyOpen = !state.historyOpen;
  $("#zHistory").classList.toggle("closed", !state.historyOpen);
});

/* =====================================================================
   Boot — two notes queued, one record behind them, nothing in flight
   ===================================================================== */
state.card = "R2";
renderDoc(false);
renderDock();
renderHistory();
renderPanel();
renderStatus();
</script>
</body>
</html>
