<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Prompt lab layout — J, annotate chat expand</title>
<style>
  /* -----------------------------------------------------------------
     Variant J — "the expanding chat takeover".

     F settled the frame: no top chrome, a centred document, and a
     280px dock of furniture in the right margin. I asked what happens
     when you stop reading and start working with the agent, and put a
     session panel in the dock's slot.

     J is about the *feeling* of that switch. Three things were missing
     and all three are motion, not colour:

       1. Entering the mode should be felt. The dock slides out to the
          right and a wider chat panel — 360px, not 280 — expands into
          its place, while the document eases left to make room. 200ms,
          no bounce. You do not read that you changed modes; you watch
          it happen.

       2. Being in the mode should look different. The document dims a
          step, every annotatable row grows a hover +, and the rows
          that carry annotations stay at full brightness with their
          R-chip. The page is visibly in a different state.

       3. Work should look like work. A note filed or a reply sent runs
          a believable sequence: thinking… shimmer, then a reply that
          streams in word by word, then the staged diff animating onto
          the row it touches, then the status dot flipping to staged.
          A hairline activity bar at the top of the panel runs while
          anything is in flight and goes still when nothing is.

     Leaving is the same move backwards, plus one line in the corner
     telling you what the session left behind.
     ----------------------------------------------------------------- */
  :root {
    --bg: #161719;
    --surface: #1c1e21;
    --line: #26282c;
    --line-soft: #202226;
    --fg: #c9ccd1;
    --bright: #dde0e5;
    --muted: #6b7078;
    --faint: #4c5158;
    --tag: #8f7bb5;
    --tag-dim: #6f6189;
    --var: #d0a45c;
    --accent: #8fa2bd;
    --open: #b8894a;
    --reply: #6f8299;
    --done: #4c5158;
    --add: #6f9a6a;
    --del: #a8635f;
    --mono: ui-monospace, "SF Mono", SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", monospace;

    --col: 96ch;       /* the document column */
    --dock: 280px;     /* furniture in the margin */
    --chat: 360px;     /* the chat panel is wider than the furniture */
    --dock-gap: 20px;
    --top: 30px;       /* the one vertical rhythm: doc top == dock top */
    --ease: cubic-bezier(0.22, 0.61, 0.36, 1);
    --dur: 200ms;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--fg);
    font-family: var(--mono);
    font-size: 13px;
    line-height: 1.8;
    display: flex;
    flex-direction: column;
    overflow: hidden;
    -webkit-font-smoothing: antialiased;
  }
  button, input, textarea {
    font-family: inherit;
    font-size: 12px;
    background: transparent;
    color: inherit;
    border: 0;
    padding: 0;
    line-height: inherit;
  }
  button { cursor: pointer; }
  ::selection { background: rgba(143, 162, 189, 0.22); }

  /* ---------- document surface — nothing above it ---------- */
  #main { flex: 1; min-height: 0; display: flex; }
  #stage {
    flex: 1;
    min-width: 0;
    overflow-y: auto;
    overflow-x: hidden;
  }
  #doc {
    max-width: var(--col);
    margin: 0 auto;
    padding: var(--top) 0 46vh;
    transform: translateX(0);
    transition: transform var(--dur) var(--ease);
  }
  /* the document eases out of the panel's way */
  #doc.annot { transform: translateX(-52px); }

  #note {
    color: var(--faint);
    font-size: 11px;
    letter-spacing: 0.04em;
    padding-left: 2ch;
    margin-bottom: 22px;
  }
  #note:empty { display: none; }

  .sec { margin-bottom: 30px; }
  .sec:last-child { margin-bottom: 0; }
  .tagline {
    color: var(--tag);
    white-space: pre;
    padding-left: 2ch;
    transition: opacity var(--dur) var(--ease);
  }

  .row {
    display: flex;
    align-items: baseline;
    transition: opacity var(--dur) var(--ease);
  }
  .row .body {
    flex: 1;
    min-width: 0;
    display: flex;
    align-items: baseline;
    gap: 1ch;
    padding: 1px 10px 1px 6px;
  }
  .row.sub .body { padding-left: calc(3ch + 6px); }
  .row.para .body { margin-top: 8px; margin-bottom: 8px; }
  .row .mk { color: var(--muted); flex: 0 0 auto; }
  .row .kk { color: var(--muted); flex: 0 0 21ch; }
  .row .tx { color: var(--fg); min-width: 0; }
  .row.spacer { height: 10px; }

  #doc.live .row .body { cursor: pointer; }
  #doc.live .row:hover .body { background: rgba(255, 255, 255, 0.028); }
  .row.sel .body {
    background: rgba(255, 255, 255, 0.05);
    box-shadow: inset 2px 0 0 var(--accent);
  }
  .row.flash .body {
    background: rgba(184, 137, 74, 0.13);
    box-shadow: inset 2px 0 0 var(--open);
  }

  /* =================================================================
     THE MODE, on the document itself.
     Everything recedes a step; what is annotated does not.
     ================================================================= */
  #doc.annot .tagline { opacity: 0.42; }
  #doc.annot .row { opacity: 0.72; }
  #doc.annot .row.tgt,
  #doc.annot .row.dold,
  #doc.annot .row.dnew { opacity: 1; }
  #doc.annot .row.tgt .body { box-shadow: inset 2px 0 0 rgba(184, 137, 74, 0.5); }
  #doc.annot .row.tgt.act .body {
    background: rgba(184, 137, 74, 0.07);
    box-shadow: inset 2px 0 0 var(--open);
  }

  /* the mode's own rail: the column edge, lit, for as long as you are in it */
  #sections { transition: box-shadow var(--dur) var(--ease); }
  #doc.annot #sections { box-shadow: inset 1px 0 0 rgba(184, 137, 74, 0.28); }

  /* the gutter is a mode affordance here, not permanent furniture */
  .gut {
    flex: 0 0 2ch;
    align-self: flex-start;
    color: var(--faint);
    text-align: left;
    opacity: 0;
    transition: opacity 110ms ease, color 110ms ease;
  }
  .row.para .gut { margin-top: 8px; }
  #doc.annot .row:hover .gut { opacity: 1; }
  #doc.annot .gut:hover { color: var(--open); }
  #doc.annot .gut.pinned { opacity: 1; color: var(--open); font-size: 9px; }

  /* the staged-change marker: a thin bar, not a badge */
  .gut.mark { opacity: 1; }
  .gut.mark::before {
    content: "";
    display: block;
    width: 2px;
    height: 1.55em;
    margin-left: 3px;
    background: var(--del);
    opacity: 0.6;
  }
  .gut.mark.add::before { background: var(--add); }

  .rchip {
    flex: 0 0 auto;
    color: var(--open);
    font-size: 11px;
    letter-spacing: 0.05em;
  }
  .rchip.staged { color: var(--add); }

  .itag { color: var(--tag-dim); }
  .var { color: var(--var); }
  .tool { color: #949aa4; }

  /* ---------- staged diff, in place ---------- */
  .row.dold .body { background: rgba(168, 99, 95, 0.075); }
  .row.dnew .body { background: rgba(111, 154, 106, 0.075); }
  .row.dold .tx { color: #9a8f8f; text-decoration: line-through; text-decoration-color: rgba(168, 99, 95, 0.55); }
  .row.dold .mk, .row.dnew .mk { color: var(--faint); }
  #doc.live .row.dold:hover .body { background: rgba(168, 99, 95, 0.11); }
  #doc.live .row.dnew:hover .body { background: rgba(111, 154, 106, 0.11); }
  .row.para.dold .body { margin-bottom: 0; }
  .row.para.dnew .body { margin-top: 0; }
  .row.dold .gut, .row.dnew .gut { opacity: 1; }

  /* the diff arriving — the last beat of the working sequence */
  @keyframes diffIn {
    from { opacity: 0; transform: translateY(-4px); }
    to   { opacity: 1; transform: none; }
  }
  .row.din { animation: diffIn 240ms var(--ease) both; }
  .row.din.dnew { animation-delay: 110ms; }

  /* ---------- inline composer ---------- */
  .composer { padding: 6px 0 8px calc(2ch + 6px); }
  .cin {
    display: block;
    width: min(62ch, 100%);
    color: var(--bright);
    border-bottom: 1px solid var(--line);
    padding: 2px 0 4px;
    outline: none;
    font-size: 13px;
  }
  .cin::placeholder { color: var(--faint); }
  .cin:focus { border-bottom-color: #3d4148; }
  .chint {
    color: var(--faint);
    font-size: 10px;
    letter-spacing: 0.06em;
    margin-top: 4px;
  }

  /* ---------- the dock: furniture in the right margin ---------- */
  #dock {
    position: fixed;
    right: var(--dock-gap);
    top: var(--top);
    width: var(--dock);
    bottom: 0;
    overflow-y: auto;
    overflow-x: hidden;
    padding-bottom: 46px;
    transform: translateX(0);
    opacity: 1;
    transition: transform var(--dur) var(--ease), opacity 150ms ease;
  }
  /* out to the right, making room for something wider */
  #dock.slid {
    transform: translateX(34px);
    opacity: 0;
    pointer-events: none;
    visibility: hidden;
    transition: transform var(--dur) var(--ease), opacity 130ms ease,
                visibility 0s linear var(--dur);
  }
  .zone { border-bottom: 1px solid var(--line-soft); }
  .zone.gone { display: none; }
  .zone.tail { border-bottom: 0; }
  .zhead {
    display: flex;
    align-items: center;
    gap: 8px;
    width: 100%;
    padding: 10px 0 7px;
    color: var(--faint);
    font-size: 10px;
    letter-spacing: 0.17em;
    text-transform: uppercase;
    cursor: default;
  }
  .zhead.tog { cursor: pointer; }
  .zhead.tog:hover { color: var(--muted); }
  .zsp { flex: 1; }
  .zhead .zn { letter-spacing: 0.06em; }
  .zhead .zc { font-size: 9px; transition: transform 120ms ease; }
  .zone.closed .zc { transform: rotate(-90deg); }
  .zbody { padding-bottom: 12px; }
  .zone.closed .zbody { display: none; }

  /* the one action that lives in a zone header: the door into the mode */
  .zsep { color: var(--line); margin: 0 -3px 0 -2px; }
  .zact {
    flex: 0 0 auto;
    color: var(--muted);
    font-size: 10px;
    letter-spacing: 0.04em;
    text-transform: none;
    cursor: pointer;
  }
  .zact:hover { color: var(--open); }

  /* agent */
  .aname { color: var(--fg); }
  .amodel { color: var(--muted); font-size: 11px; }
  .adesc { color: var(--faint); font-size: 11px; line-height: 1.6; margin-top: 4px; }

  /* ---------- view switcher ---------- */
  #zView .zbody { padding-bottom: 14px; }
  .vitem {
    display: flex;
    align-items: baseline;
    gap: 10px;
    width: 100%;
    text-align: left;
    color: var(--muted);
    font-size: 14px;
    letter-spacing: 0.03em;
    padding: 5px 0 5px 12px;
    border-left: 1px solid transparent;
  }
  .vitem:hover { color: var(--fg); }
  .vitem.active { color: var(--bright); border-left-color: var(--accent); }
  .vitem .vn { flex: 0 0 auto; }
  .vitem .vt {
    flex: 0 0 auto;
    color: var(--faint);
    font-size: 10px;
    letter-spacing: 0.04em;
  }
  .vitem.active .vt { color: var(--muted); }

  /* outline */
  .oitem {
    display: block;
    width: 100%;
    text-align: left;
    color: var(--muted);
    font-size: 12px;
    padding: 1px 0 1px 12px;
    border-left: 1px solid transparent;
  }
  .oitem:hover { color: var(--fg); }
  .oitem.active { color: var(--fg); border-left-color: var(--accent); }

  /* fixture */
  .fitem {
    display: flex;
    align-items: baseline;
    gap: 8px;
    width: 100%;
    text-align: left;
    color: var(--muted);
    font-size: 12px;
    padding: 2px 0 2px 12px;
    border-left: 1px solid transparent;
  }
  .fitem:hover { color: var(--fg); }
  .fitem.active { color: var(--fg); border-left-color: var(--accent); }
  .fitem .fn { color: var(--faint); font-size: 10px; }

  /* details */
  .drow { display: flex; gap: 8px; font-size: 11px; line-height: 1.7; }
  .drow .dk { color: var(--faint); flex: 0 0 42px; }
  .drow .dv { color: var(--muted); min-width: 0; overflow-wrap: break-word; }
  .drow .dv.id { color: var(--fg); word-break: break-all; }

  /* requests, in the dock */
  .rrow {
    display: flex;
    align-items: baseline;
    gap: 8px;
    width: 100%;
    text-align: left;
    padding: 3px 0;
    color: var(--muted);
  }
  .rrow:hover { color: var(--fg); }
  .rdot {
    flex: 0 0 6px;
    width: 6px; height: 6px;
    border-radius: 50%;
    background: var(--done);
    align-self: center;
  }
  .rdot.open { background: var(--open); }
  .rdot.replied { background: var(--reply); }
  .rdot.staged { background: var(--add); }
  .rrow .ra { flex: 0 0 auto; color: var(--fg); font-size: 11px; }
  .rrow .rt {
    flex: 1;
    min-width: 0;
    font-size: 11px;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }

  /* history */
  .hrow { display: flex; align-items: baseline; gap: 8px; font-size: 11px; color: var(--muted); padding: 2px 0; }
  .hrow.past .hh { color: var(--muted); }
  .hrow .hh { color: var(--fg); }
  .hrow .hsp { flex: 1; }
  .hrow .ht { color: var(--faint); }
  .hrow .hcur { color: var(--faint); font-size: 9px; letter-spacing: 0.1em; }

  /* =================================================================
     THE CHAT PANEL — wider than the dock, and it expands into its slot
     ================================================================= */
  #chat {
    position: fixed;
    right: var(--dock-gap);
    top: var(--top);
    width: var(--chat);
    bottom: 28px;
    display: flex;
    flex-direction: column;
    min-height: 0;
    transform: translateX(0);
    opacity: 1;
    transition: transform var(--dur) var(--ease), opacity var(--dur) ease,
                width var(--dur) var(--ease);
  }
  #chat.off {
    width: var(--dock);          /* it grows on the way in, shrinks on the way out */
    transform: translateX(40px);
    opacity: 0;
    pointer-events: none;
    visibility: hidden;
    transition: transform var(--dur) var(--ease), opacity 140ms ease,
                width var(--dur) var(--ease), visibility 0s linear var(--dur);
  }

  /* the activity bar: a hairline that runs while anything is in flight */
  #bar {
    flex: 0 0 auto;
    position: relative;
    height: 1px;
    background: var(--line-soft);
    overflow: hidden;
  }
  #bar::after {
    content: "";
    position: absolute;
    top: 0; left: 0;
    height: 1px;
    width: 38%;
    background: linear-gradient(90deg,
      rgba(184, 137, 74, 0) 0%, var(--open) 50%, rgba(184, 137, 74, 0) 100%);
    opacity: 0;
    transform: translateX(-100%);
    transition: opacity 180ms ease;
  }
  #bar.work::after {
    opacity: 0.85;
    animation: barRun 1.05s linear infinite;
  }
  @keyframes barRun {
    from { transform: translateX(-100%); }
    to   { transform: translateX(305%); }
  }

  .chead {
    display: flex;
    align-items: center;
    gap: 8px;
    flex: 0 0 auto;
    padding: 10px 0 6px;
    font-size: 10px;
    letter-spacing: 0.17em;
    text-transform: uppercase;
    color: var(--open);
  }
  .cdone {
    flex: 0 0 auto;
    color: var(--faint);
    font-size: 10px;
    letter-spacing: 0.04em;
    text-transform: none;
  }
  .cdone:hover { color: var(--bright); }
  .cdone .xk { margin-right: 3px; }

  .cstat {
    flex: 0 0 auto;
    color: var(--faint);
    font-size: 10px;
    letter-spacing: 0.08em;
    padding: 0 0 8px;
    border-bottom: 1px solid var(--line-soft);
  }
  .cstat.work { color: var(--muted); }

  #chatList {
    flex: 1;
    min-height: 0;
    overflow-y: auto;
    overflow-x: hidden;
    padding: 8px 0 10px;
  }

  /* ---------- the annotation cards ---------- */
  .card {
    display: flex;
    flex-direction: column;
    align-items: stretch;
    width: 100%;
    text-align: left;
    color: var(--muted);
    padding: 3px 0 4px 8px;
    border-left: 1px solid transparent;
  }
  .card:hover { color: var(--fg); }
  .card.on { color: var(--fg); border-left-color: var(--open); }
  .cline { display: flex; align-items: baseline; gap: 8px; }
  .cdot {
    flex: 0 0 6px;
    width: 6px; height: 6px;
    border-radius: 50%;
    background: var(--done);
    align-self: center;
  }
  .cdot.open { background: var(--open); }
  .cdot.replied { background: var(--reply); }
  .cdot.staged { background: var(--add); }
  .cdot.resolved { background: var(--done); }
  @keyframes dotPulse {
    0%   { box-shadow: 0 0 0 0 rgba(111, 154, 106, 0.5); }
    70%  { box-shadow: 0 0 0 6px rgba(111, 154, 106, 0); }
    100% { box-shadow: 0 0 0 0 rgba(111, 154, 106, 0); }
  }
  .cdot.pulse { animation: dotPulse 1.5s var(--ease) 2; }
  .card .ca { flex: 0 0 auto; color: var(--fg); font-size: 11px; }
  .card.res .ca { color: var(--muted); }
  .card .cst {
    flex: 0 0 auto;
    color: var(--faint);
    font-size: 9px;
    letter-spacing: 0.13em;
    text-transform: uppercase;
  }
  .card .csp { flex: 1; }
  .cnote {
    font-size: 11px;
    line-height: 1.5;
    padding-left: 14px;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  .card.on .cnote { white-space: normal; }
  .ctgt {
    color: var(--faint);
    font-size: 9px;
    letter-spacing: 0.09em;
    padding-left: 14px;
    line-height: 1.5;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  .ctgt .ck { opacity: 0.7; }

  /* ---------- the thread: the active card, unfolded ---------- */
  .thread {
    margin: 3px 0 14px 9px;
    padding: 3px 0 0 11px;
    border-left: 1px solid var(--line);
  }
  .tmsg { padding: 3px 0 6px; }
  .tmeta {
    display: flex;
    align-items: baseline;
    gap: 8px;
    font-size: 9px;
    letter-spacing: 0.15em;
    text-transform: uppercase;
    color: var(--faint);
  }
  .tmeta .who { color: var(--muted); }
  .tmeta .who.agent { color: var(--tag-dim); }
  .tsp { flex: 1; }
  .tbody {
    color: var(--fg);
    font-size: 11px;
    line-height: 1.65;
    overflow-wrap: break-word;
  }
  .tmsg.agent .tbody { color: var(--muted); }

  /* thinking… — a shimmer, not a spinner */
  @keyframes shim {
    from { background-position: 200% 0; }
    to   { background-position: 0 0; }
  }
  .think {
    font-size: 10px;
    letter-spacing: 0.13em;
    padding: 4px 0 6px;
    background: linear-gradient(90deg, #43474d 0%, #9aa1ab 50%, #43474d 100%);
    background-size: 200% 100%;
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
    animation: shim 1.15s linear infinite;
  }

  @keyframes caret { 50% { opacity: 0; } }
  .cur { color: var(--tag-dim); animation: caret 900ms steps(1) infinite; }

  .tacts {
    padding: 5px 0 2px;
    border-top: 1px solid var(--line-soft);
    margin-top: 4px;
    font-size: 10px;
    letter-spacing: 0.04em;
  }
  .tstaged { display: block; color: var(--faint); margin-bottom: 2px; }
  .tstaged .tsq { color: var(--add); opacity: 0.8; margin-right: 3px; }
  .tact { font-size: 10px; letter-spacing: 0.06em; color: var(--muted); }
  .tact.acc { color: var(--add); }
  .tact.acc:hover { color: #8bb886; }
  .tact.dis:hover { color: var(--del); }
  .tdot { color: var(--faint); margin: 0 4px; }
  .tdone { color: var(--faint); font-size: 10px; letter-spacing: 0.06em; padding: 4px 0 2px; }

  .cfoot { flex: 0 0 auto; border-top: 1px solid var(--line-soft); }
  .cin2 {
    display: block;
    width: 100%;
    min-height: 46px;
    max-height: 34vh;
    resize: none;
    color: var(--bright);
    font-size: 12px;
    line-height: 1.6;
    padding: 8px 0 2px;
    outline: none;
    overflow-y: auto;
  }
  .cin2::placeholder { color: var(--faint); }
  .chint2 {
    color: var(--faint);
    font-size: 9px;
    letter-spacing: 0.09em;
    padding-bottom: 4px;
  }

  /* ---------- corners ---------- */
  #status {
    position: fixed;
    right: var(--dock-gap);
    bottom: 9px;
    color: var(--faint);
    font-size: 10px;
    letter-spacing: 0.06em;
    pointer-events: none;
    user-select: none;
    transition: opacity 220ms ease, color 220ms ease;
  }
  #status.say { color: var(--muted); }
  #stamp {
    position: fixed;
    left: 14px;
    bottom: 9px;
    color: var(--faint);
    font-size: 10px;
    letter-spacing: 0.12em;
    pointer-events: none;
    user-select: none;
  }

  /* ---------- fallback: too narrow to keep the panel in a margin ---------- */
  @media (max-width: 1499px) {
    #dock {
      position: static;
      flex: 0 0 260px;
      width: 260px;
      border-left: 1px solid var(--line);
      background: var(--surface);
      padding: 0 14px 40px;
      overflow-y: auto;
      transform: none;
    }
    #dock.slid { display: none; }
    #chat {
      position: static;
      flex: 0 0 320px;
      width: 320px;
      border-left: 1px solid var(--line);
      background: var(--surface);
      padding: 0 14px 10px;
      transform: none;
    }
    #chat.off { display: none; }
    #doc { margin: 0; padding-left: max(2ch, 20px); padding-right: 24px; }
    #doc.annot { transform: none; }
    #status { right: 14px; }
  }

  @media (prefers-reduced-motion: reduce) {

/* =====================================================================
   Small helpers
   ===================================================================== */
function esc(t) {
  return String(t)
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;");
}

function clock() {
  const d = new Date();
  let h = d.getHours();
  const m = String(d.getMinutes()).padStart(2, "0");
  const ap = h >= 12 ? "PM" : "AM";
  h = h % 12 || 12;
  return h + ":" + m + " " + ap;
}

function tidy(t) { return String(t).replace(/\s+/g, " ").trim(); }

function trunc(t, n) {
  const s = tidy(t);
  return s.length > n ? s.slice(0, n - 1) + "…" : s;
}

function shortId(id) { return String(id).replace(/^node-/, ""); }

function reqBy(alias) { return REQUESTS.find((r) => r.alias === alias) || null; }
function liveRequests() { return REQUESTS.filter((r) => r.status !== "resolved"); }
function openRequests() {
  return REQUESTS.filter((r) => r.status !== "resolved" && !r.diff);
}
function stagedRequests() {
  return REQUESTS.filter((r) => r.diff && r.status !== "resolved");
}
/* the annotations pinned on a row — only rendered inside the mode */
function reqFor(id) {
  return REQUESTS.filter((r) => r.node === id && r.status !== "resolved" && !r.diff);
}
function stagedFor(id) {
  return REQUESTS.find((r) => r.diff && r.diff.node === id && r.status !== "resolved") || null;
}

/* =====================================================================
   Document rendering
   ===================================================================== */
const TOOL_RE = /\b(read_prompt|propose_transaction|resolve_request|reply_request|add_note)\b/g;

function highlight(t) {
  let h = esc(t);
  h = h.replace(/&lt;(\/?[a-z_][\w_]*)&gt;/g, '<span class="itag">&lt;$1&gt;</span>');
  h = h.replace(/\{\{([a-zA-Z]+)\}\}/g, '<span class="var">{{$1}}</span>');
  h = h.replace(TOOL_RE, '<span class="tool">$1</span>');
  return h;
}

function innerHtml(r, text, chips) {
  if (r.type === "kv") {
    return '<span class="kk">' + esc(r.k) + ':</span>' + chips +
      '<span class="tx">' + highlight(r.v) + "</span>";
  }
  if (r.type === "bullet" || r.type === "sub") {
    return '<span class="mk">-</span>' + chips + '<span class="tx">' + highlight(text) + "</span>";
  }
  if (r.type === "step") {
    return '<span class="mk">' + r.n + '.</span>' + chips +
      '<span class="tx">' + highlight(text) + "</span>";
  }
  return chips + '<span class="tx">' + highlight(text) + "</span>";
}

function shellHtml(r, cls, gut, inner) {
  return '<div class="row ' + r.type + cls + '" data-id="' + r.id +
    '" data-kind="' + esc(r.kind) + '" data-diag="' + esc(r.diag || "") + '">' +
    gut + '<div class="body">' + inner + "</div></div>";
}

function rowHtml(r, live) {
  if (r.spacer) return '<div class="row spacer"></div>';

  /* staged diffs are a fact of the annotation session — they show in the mode */
  const staged = state.annot && live ? stagedFor(r.id) : null;
  if (staged) {
    const fresh = state.fresh === staged.alias ? " din" : "";
    const act = state.card === staged.alias ? " act" : "";
    const oldRow = shellHtml(r, " dold tgt" + act + fresh,
      '<span class="gut mark"></span>', innerHtml(r, r.text, ""));
    const chip = '<span class="rchip staged">' + staged.alias + "</span>";
    const newRow = shellHtml(r, " dnew tgt" + act + fresh,
      '<span class="gut mark add"></span>', innerHtml(r, staged.diff.new, chip));
    return oldRow + newRow;
  }

  const pinned = state.annot && live ? reqFor(r.id) : [];
  const gut = live && state.annot
    ? '<button class="gut' + (pinned.length ? " pinned" : "") + '" data-gut="' + r.id +
      '" title="' + (pinned.length ? "annotation pinned here" : "annotate this node") + '">' +
      (pinned.length ? "&#9679;" : "+") + "</button>"
    : '<span class="gut"></span>';

  const chips = pinned.map((p) => '<span class="rchip">' + p.alias + "</span>").join("");
  let cls = state.selected === r.id ? " sel" : "";
  if (pinned.length) {
    cls += " tgt";
    if (pinned.some((p) => p.alias === state.card)) cls += " act";
  }
  return shellHtml(r, cls, gut, innerHtml(r, r.text, chips));
}

function renderDoc(keepScroll) {
  const live = state.view === "system";
  const top = keepScroll ? stageEl.scrollTop : 0;

  state.sections = state.view === "system" ? SYSTEM
    : state.view === "context" ? CONTEXT
    : buildState(state.fixture);

  docEl.classList.toggle("live", live);
  docEl.classList.toggle("annot", state.annot && live);
  $("#note").textContent = NOTE[state.view] || "";

  sectionsEl.innerHTML = state.sections.map((s) =>
    '<section class="sec" data-tag="' + s.tag + '">' +
      '<div class="tagline">&lt;' + s.tag + "&gt;</div>" +
      s.rows.map((r) => rowHtml(r, live)).join("") +
      '<div class="tagline">&lt;/' + s.tag + "&gt;</div>" +
    "</section>"
  ).join("");

  stageEl.scrollTop = top;
  state.active = null;
  spy();
}

/* =====================================================================
   Dock
   ===================================================================== */
function show(id, on) {
  document.getElementById(id).classList.toggle("gone", !on);
}

function renderDock() {
  const view = state.view;
  show("zAgent", true);
  show("zView", true);
  show("zFixture", view === "state");
  show("zOutline", true);
  show("zDetails", view === "system" && !!state.selected);
  show("zRequests", view === "system" && REQUESTS.length > 0);
  show("zHistory", view === "system");

  renderViews();
  renderOutline();
  renderFixtures();
  renderDetails();
  renderRequests();
  trimRule();
}

/* the last visible zone drops its hairline, whatever it happens to be */
function trimRule() {
  const zones = [...document.querySelectorAll("#dock .zone")];
  let last = null;
  zones.forEach((z) => {
    z.classList.remove("tail");
    if (!z.classList.contains("gone")) last = z;
  });
  if (last) last.classList.add("tail");
}

function renderViews() {
  $("#viewBody").innerHTML = VIEWS.map((v) =>
    '<button class="vitem' + (v.id === state.view ? " active" : "") +
    '" data-view="' + v.id + '"><span class="vn">' + v.id + "</span>" +
    '<span class="zsp"></span><span class="vt">' + v.tok() + "</span></button>"
  ).join("");
}

function renderOutline() {
  $("#outlineBody").innerHTML = state.sections.map((s) =>
    '<button class="oitem' + (s.tag === state.active ? " active" : "") +
    '" data-sec="' + s.tag + '">' + s.tag + "</button>"
  ).join("");
}

function renderFixtures() {
  $("#fixtureBody").innerHTML = FIXTURES.map((f) =>
    '<button class="fitem' + (f.name === state.fixture ? " active" : "") +
    '" data-fix="' + f.name + '"><span>' + f.name + '</span>' +
    '<span class="zsp"></span><span class="fn">' + f.note + "</span></button>"
  ).join("");
}

function findRow(id) {
  for (const s of state.sections) {
    for (const r of s.rows) if (r.id === id) return { sec: s, row: r };
  }
  return null;
}

function renderDetails() {
  if (!state.selected) { $("#detailsBody").innerHTML = ""; return; }
  const found = findRow(state.selected);
  if (!found) { $("#detailsBody").innerHTML = ""; return; }
  const r = found.row;
  $("#detailsBody").innerHTML =
    '<div class="drow"><span class="dk">id</span><span class="dv id">' + esc(r.id) + "</span></div>" +
    '<div class="drow"><span class="dk">kind</span><span class="dv">' + esc(r.kind) +
      " · &lt;" + found.sec.tag + "&gt;</span></div>" +
    '<div class="drow"><span class="dk">note</span><span class="dv">' + esc(r.diag || "—") + "</span></div>";
}

function dotClass(r) {
  if (r.status === "resolved") return "resolved";
  if (r.diff) return "staged";
  if (r.status === "replied") return "replied";
  return "open";
}

function renderRequests() {
  const n = liveRequests().length;
  $("#reqCount").textContent = n + " open";
  $("#requestsBody").innerHTML = REQUESTS.map((r) =>
    '<button class="rrow" data-req="' + r.alias + '">' +
      '<span class="rdot ' + dotClass(r) + '"></span>' +
      '<span class="ra">' + r.alias + "</span>" +
      '<span class="rt">' + esc(tidy(r.note)) + "</span>" +
    "</button>"
  ).join("");
}

function renderHistory() {
  $("#historyBody").innerHTML = HISTORY.map((h) =>
    '<div class="hrow' + (h.cur ? "" : " past") + '">' +
      '<span class="hh">' + h.hash + "</span><span class=\"hsp\"></span>" +
      (h.cur ? '<span class="hcur">CURRENT</span>' : '<span class="ht">' + h.when + "</span>") +
    "</div>"
  ).join("");
}

/* the whisper: the save, or whatever the session last wanted to say */
function renderStatus() {
  const el = $("#status");
  if (state.whisper) {
    el.textContent = state.whisper;
    el.classList.add("say");
    return;
  }
  el.classList.remove("say");
  if (state.annot) { el.textContent = ""; return; }
  el.textContent = state.view === "system" ? "saved 3:42 PM" : "";
}

let whisperTimer = null;
function whisper(text, ms) {
  state.whisper = text;
  renderStatus();
  clearTimeout(whisperTimer);
  whisperTimer = setTimeout(() => {
    state.whisper = null;
    renderStatus();
  }, ms || 4400);
}

/* =====================================================================
   Scroll spy
   ===================================================================== */
function spy() {
  const secs = [...sectionsEl.querySelectorAll(".sec")];
  if (!secs.length) return;
  const base = stageEl.getBoundingClientRect().top;
  let cur = secs[0].dataset.tag;
  for (const s of secs) {
    if (s.getBoundingClientRect().top - base <= 110) cur = s.dataset.tag;
  }
  if (cur === state.active) return;
  state.active = cur;
  document.querySelectorAll(".oitem").forEach((o) =>
    o.classList.toggle("active", o.dataset.sec === cur));
}

stageEl.addEventListener("scroll", spy);

function scrollToEl(el, offset) {
  const top = el.getBoundingClientRect().top - stageEl.getBoundingClientRect().top +
    stageEl.scrollTop - offset;
  stageEl.scrollTo({ top: Math.max(0, top), behavior: "smooth" });
}

function scrollToNode(id, offset) {
  const row = sectionsEl.querySelector('.row[data-id="' + id + '"]');
  if (row) scrollToEl(row, offset === undefined ? 170 : offset);
}

function flash(id) {
  const row = sectionsEl.querySelector('.row[data-id="' + id + '"]');
  if (!row) return;
  row.classList.add("flash");
  setTimeout(() => row.classList.remove("flash"), 1100);
}

/* =====================================================================
   View switching — from the dock. The mode pins the view to System.
   ===================================================================== */
function setView(view) {
  if (state.view === view) return;
  if (state.annot && view !== "system") return;
  state.view = view;
  state.selected = null;
  closeComposer();
  renderDoc(false);
  renderDock();
  renderStatus();
}

$("#viewBody").addEventListener("click", (e) => {
  const item = e.target.closest(".vitem");
  if (!item) return;
  setView(item.dataset.view);
});

/* =====================================================================
   Selection · details
   ===================================================================== */
sectionsEl.addEventListener("click", (e) => {
  if (e.target.closest(".gut") || e.target.closest(".composer")) return;
  if (state.view !== "system") return;
  const row = e.target.closest(".row");
  if (!row || !row.dataset.id) return;

  /* inside the mode, clicking an annotated row is how you change the subject */
  if (state.annot) {
    const owner = stagedFor(row.dataset.id) || reqFor(row.dataset.id)[0];
    if (owner) openCard(owner.alias, false);
    return;
  }

  state.selected = state.selected === row.dataset.id ? null : row.dataset.id;
  renderDoc(true);
  renderDock();
});

/* =====================================================================
   The gutter + → an inline note → the agent goes to work
   ===================================================================== */
function closeComposer() {
  const c = docEl.querySelector(".composer");
  if (c) c.remove();
  state.composer = null;
}

function openComposer(id) {
  if (!state.annot) return;
  const row = sectionsEl.querySelector('.row[data-id="' + id + '"]');
  if (!row) return;
  closeComposer();
  state.composer = id;

  const box = document.createElement("div");
  box.className = "composer";
  box.innerHTML =
    '<input class="cin" type="text" placeholder="what should change here?" />' +
    '<div class="chint">Enter to file &middot; Esc to cancel</div>';
  row.parentNode.insertBefore(box, row);

  const input = box.querySelector(".cin");
  input.focus();
  input.addEventListener("keydown", (e) => {
    if (e.key === "Escape") { e.preventDefault(); e.stopPropagation(); closeComposer(); return; }
    if (e.key !== "Enter") return;
    e.preventDefault();
    const note = input.value.trim();
    if (!note) { closeComposer(); return; }
    fileNote(id, note);
  });
}

sectionsEl.addEventListener("click", (e) => {
  const gut = e.target.closest(".gut");
  if (!gut || !gut.dataset.gut) return;
  e.stopPropagation();
  if (state.composer === gut.dataset.gut) { closeComposer(); return; }
  openComposer(gut.dataset.gut);
});

function fileNote(id, note) {
  const alias = "R" + state.nextAlias++;
  const r = {
    alias: alias,
    node: id,
    status: "open",
    note: note,
    thread: [{ who: "you", t: clock(), text: note }],
    diff: null,
  };
  REQUESTS.push(r);
  closeComposer();
  state.card = alias;
  renderDoc(true);
  renderPanel();
  renderDock();
  flash(id);
  work(r);                 /* filing is a beginning, not an ending */
}

/* =====================================================================
   THE PANEL
   ===================================================================== */
function statusWord(r) {
  if (r.status === "resolved") return "accepted";
  if (r.phase) return "working";
  if (r.diff) return "staged";
  if (r.status === "replied") return "replied";
  return "open";
}

function threadHtml(r) {
  let out = r.thread.map((m) =>
    '<div class="tmsg ' + m.who + '">' +
      '<div class="tmeta"><span class="who ' + m.who + '">' + m.who + "</span>" +
      '<span class="tsp"></span><span>' + esc(m.t) + "</span></div>" +
      '<div class="tbody">' + esc(m.text) + "</div>" +
    "</div>"
  ).join("");

  if (r.phase === "thinking") {
    out += '<div class="think">thinking&hellip;</div>';
  } else if (r.phase === "streaming") {
    out +=
      '<div class="tmsg agent">' +
        '<div class="tmeta"><span class="who agent">agent</span>' +
        '<span class="tsp"></span><span>' + esc(r.streamT || clock()) + "</span></div>" +
        '<div class="tbody"><span data-stream="' + r.alias + '">' + esc(r.stream || "") +
          '</span><span class="cur">&#9615;</span></div>' +
      "</div>";
  }

  if (r.status === "resolved") {
    out += '<div class="tdone">accepted &middot; ' + esc(r.hash || "") + "</div>";
  } else if (r.diff && !r.phase) {
    out +=
      '<div class="tacts">' +
        '<span class="tstaged"><span class="tsq">&#9612;</span>staged on ' +
          esc(shortId(r.diff.node)) + "</span>" +
        '<button class="tact acc" data-acc="' + r.alias + '">Accept</button>' +
        '<span class="tdot">&middot;</span>' +
        '<button class="tact dis" data-dis="' + r.alias + '">Discard</button>' +
      "</div>";
  }

  return '<div class="thread" data-thread="' + r.alias + '">' + out + "</div>";
}

function cardHtml(r) {
  const on = state.card === r.alias;
  const res = r.status === "resolved";
  const head =
    '<button class="card' + (on ? " on" : "") + (res ? " res" : "") +
      '" data-card="' + r.alias + '">' +
      '<span class="cline">' +
        '<span class="cdot ' + dotClass(r) + (state.pulse === r.alias ? " pulse" : "") + '"></span>' +
        '<span class="ca">' + r.alias + "</span>" +
        '<span class="csp"></span>' +
        '<span class="cst">' + statusWord(r) + "</span>" +
      "</span>" +
      '<span class="cnote">' + esc(on ? tidy(r.note) : trunc(r.note, 42)) + "</span>" +
      '<span class="ctgt"><span class="ck">target</span> ' +
        esc(shortId(r.diff ? r.diff.node : r.node)) + "</span>" +
    "</button>";
  return head + (on ? threadHtml(r) : "");
}

function panelStatus() {
  if (state.busy > 0) return { text: "agent working…", work: true };
  if (!liveRequests().length) return { text: "queue clear", work: false };
  const st = stagedRequests().length;
  const op = openRequests().length;
  return { text: op + " open · " + st + " staged", work: false };
}

function renderPanel() {
  const st = panelStatus();
  const statEl = $("#chatStat");
  statEl.textContent = st.text;
  statEl.classList.toggle("work", st.work);
  barEl.classList.toggle("work", state.busy > 0);

  const top = listEl.scrollTop;
  listEl.innerHTML = REQUESTS.map(cardHtml).join("");
  listEl.scrollTop = top;
}

function scrollThreadEnd() {
  const th = listEl.querySelector(".thread");
  if (!th) return;
  const want = th.offsetTop + th.offsetHeight - listEl.clientHeight + 12;
  listEl.scrollTo({ top: Math.max(0, want), behavior: "smooth" });
}

function openCard(alias, focusMsg) {
  state.card = alias;
  const r = reqBy(alias);
  renderPanel();
  renderDoc(true);
  if (r) {
    const node = r.diff ? r.diff.node : r.node;
    if (node) { scrollToNode(node); flash(node); }
  }
  if (focusMsg) msgEl.focus({ preventScroll: true });
}

/* =====================================================================
   THE WORKING SEQUENCE — the point of the variant.
   thinking… → the reply streams → the diff lands → the dot flips.
   ===================================================================== */
function setBusy(d) {
  state.busy = Math.max(0, state.busy + d);
  barEl.classList.toggle("work", state.busy > 0);
}

/* when a note has no scripted answer, the agent folds it into its own node */
function synthStage(r) {
  const found = findRow(r.node);
  if (!found) return null;
  const base = found.row.text.replace(/\.\s*$/, "");
  const note = tidy(r.note).replace(/\.\s*$/, "");
  return {
    say: "Read that node against your note. Staged one clause on " + shortId(r.node) +
      " — nothing else in the section is touched.",
    new: base + " — " + note.charAt(0).toLowerCase() + note.slice(1) + ".",
  };
}

function streamWords(r, text, done) {
  const words = text.split(" ");
  let i = 0;
  r.stream = "";
  (function step() {
    if (state.card !== r.alias || r.phase !== "streaming") { r.stream = text; done(); return; }
    const el = listEl.querySelector('[data-stream="' + r.alias + '"]');
    if (!el) { r.stream = text; done(); return; }
    i += 1;
    r.stream = words.slice(0, i).join(" ");
    el.textContent = r.stream;
    if (i % 4 === 0) scrollThreadEnd();
    if (i < words.length) { setTimeout(step, 30); return; }
    scrollThreadEnd();
    setTimeout(done, 170);
  })();
}

function work(r) {
  const spec = r.stage || synthStage(r);
  if (!spec) return;
  r.stage = null;

  setBusy(1);
  r.phase = "thinking";
  r.status = "open";
  state.card = r.alias;
  renderPanel();
  renderDock();
  scrollThreadEnd();

  setTimeout(() => {
    r.phase = "streaming";
    r.streamT = clock();
    r.stream = "";
    renderPanel();
    scrollThreadEnd();

    streamWords(r, spec.say, () => {
      r.thread.push({ who: "agent", t: r.streamT, text: spec.say });
      r.phase = null;
      r.stream = null;
      r.status = "replied";
      renderPanel();

      /* the diff arrives a beat after the sentence that promised it */
      setTimeout(() => {
        if (spec.new) {
          r.diff = { node: r.node, new: spec.new };
          state.fresh = r.alias;
          state.pulse = r.alias;
          renderDoc(true);
          setTimeout(() => { state.fresh = null; }, 700);
          setTimeout(() => {
            if (state.pulse === r.alias) { state.pulse = null; renderPanel(); }
          }, 3200);
        }
        setBusy(-1);
        renderPanel();
        renderDock();
        scrollThreadEnd();
      }, 240);
    });
  }, 560);
}

/* a message in the bottom composer is a reply on the open card */
function sendMessage(text) {
  let r = reqBy(state.card);
  if (!r || r.status === "resolved") r = liveRequests()[0] || null;
  if (!r) return;

  r.thread.push({ who: "you", t: clock(), text: text });
  state.card = r.alias;

  /* a reply on something already staged asks for another pass at it */
  if (r.diff) {
    r.stage = {
      say: "Fair. Reworked the staged clause on " + shortId(r.diff.node) +
        " so it lands the consequence once and stops.",
      new: r.diff.new.replace(/\.\s*$/, "") + ", " + trunc(text, 44).toLowerCase() + ".",
    };
    r.diff = null;
  }

  renderPanel();
  renderDoc(true);
  scrollThreadEnd();
  work(r);
}

/* =====================================================================
   Accept · discard
   ===================================================================== */
function acceptCard(alias) {
  const r = reqBy(alias);
  if (!r || !r.diff) return;
  const node = r.diff.node;
  const found = findRow(node);
  if (found) found.row.text = r.diff.new;
  r.diff = null;
  r.status = "resolved";
  r.hash = "pk1-" + Math.random().toString(16).slice(2, 10);
  r.thread.push({ who: "agent", t: clock(), text: "Resolved: accepted and saved as " + r.hash + "." });

  HISTORY.forEach((h) => { if (h.cur) { h.cur = false; h.when = "moments ago"; } });
  HISTORY.unshift({ hash: r.hash, when: "just now", cur: true });
  state.historyOpen = true;
  $("#zHistory").classList.remove("closed");

  const next = liveRequests()[0];
  state.card = next ? next.alias : alias;
  renderDoc(true);
  renderPanel();
  renderDock();
  renderHistory();
  flash(node);
}

function discardCard(alias) {
  const r = reqBy(alias);
  if (!r || !r.diff) return;
  const node = r.diff.node;
  r.diff = null;
  r.status = "open";
  r.thread.push({ who: "you", t: clock(), text: "Discarded that proposal." });
  renderDoc(true);
  renderPanel();
  renderDock();
  flash(node);
}

/* =====================================================================
   ENTER · EXIT — the move the whole variant is about
   ===================================================================== */
function enterAnnotate() {
  if (state.annot) return;
  if (state.view !== "system") setView("system");
  state.annot = true;
  state.selected = null;
  state.whisper = null;
  clearTimeout(whisperTimer);

  const cur = reqBy(state.card);
  if (!cur || cur.status === "resolved") {
    const next = liveRequests()[0];
    state.card = next ? next.alias : null;
  }

  $("#dock").classList.add("slid");
  chatEl.classList.remove("off");
  renderDoc(true);
  renderPanel();
  renderStatus();

  /* bring the thing you are annotating into view — the mode should not
     open onto a paragraph nobody is talking about */
  const cur2 = reqBy(state.card);
  const node = cur2 ? (cur2.diff ? cur2.diff.node : cur2.node) : null;
  if (node) {
    scrollToNode(node, 200);
    setTimeout(() => flash(node), 220);
  }
  requestAnimationFrame(() => msgEl.focus({ preventScroll: true }));
}

function exitAnnotate() {
  if (!state.annot) return;
  state.annot = false;
  closeComposer();

  chatEl.classList.add("off");
  $("#dock").classList.remove("slid");
  renderDoc(true);
  renderDock();

  const st = stagedRequests().length;
  const op = openRequests().length;
  whisper("annotation session: " + st + " staged, " + op + " open");
}

$("#goAnnot").addEventListener("click", (e) => {
  e.stopPropagation();
  enterAnnotate();
});
$("#chatDone").addEventListener("click", exitAnnotate);

/* =====================================================================
   Wiring
   ===================================================================== */
listEl.addEventListener("click", (e) => {
  const acc = e.target.closest(".tact.acc");
  if (acc) { e.stopPropagation(); acceptCard(acc.dataset.acc); return; }
  const dis = e.target.closest(".tact.dis");
  if (dis) { e.stopPropagation(); discardCard(dis.dataset.dis); return; }
  const card = e.target.closest(".card");
  if (!card) return;
  openCard(card.dataset.card, true);
});

msgEl.addEventListener("keydown", (e) => {
  if (e.key === "Escape") {
    e.preventDefault();
    if (msgEl.value.trim()) { msgEl.value = ""; return; }
    exitAnnotate();
    return;
  }
  if (e.key !== "Enter" || e.shiftKey) return;
  e.preventDefault();
  const text = msgEl.value.trim();
  if (!text) return;
  msgEl.value = "";
  sendMessage(text);
});

document.addEventListener("keydown", (e) => {
  if (e.key !== "Escape") return;
  if (state.composer) { closeComposer(); return; }
  if (state.annot && document.activeElement !== msgEl) exitAnnotate();
});

$("#outlineBody").addEventListener("click", (e) => {
  const item = e.target.closest(".oitem");
  if (!item) return;
  const sec = sectionsEl.querySelector('.sec[data-tag="' + item.dataset.sec + '"]');
  if (sec) scrollToEl(sec, 24);
});

/* a request in the dock is a door into the mode, already on that card */
$("#requestsBody").addEventListener("click", (e) => {
  const rr = e.target.closest(".rrow");
  if (!rr) return;
  state.card = rr.dataset.req;
  enterAnnotate();
  const r = reqBy(rr.dataset.req);
  const node = r ? (r.diff ? r.diff.node : r.node) : null;
  if (node) { scrollToNode(node); flash(node); }
});

$("#fixtureBody").addEventListener("click", (e) => {
  const fi = e.target.closest(".fitem");
  if (!fi) return;
  state.fixture = fi.dataset.fix;
  renderDoc(false);
  renderDock();
  renderStatus();
});

$("#histHead").addEventListener("click", () => {
  state.historyOpen = !state.historyOpen;
  $("#zHistory").classList.toggle("closed", !state.historyOpen);
});

/* =====================================================================
   Boot
   ===================================================================== */
renderDoc(false);
renderDock();
renderHistory();
renderPanel();
renderStatus();
</script>
</body>
</html>
